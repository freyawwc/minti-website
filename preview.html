<title>minti Site Preview</title>

<style>
  /* Shell palette: warm neutrals pulled toward the site's own #ec5230 so the
     harness reads as related to minti but never competes with the page inside. */
  :root {
    --ground: #e9e6e1;
    --bar: #fcfbfa;
    --ink: #1c1a18;
    --muted: #7b746c;
    --line: #d9d5ce;
    --sunk: #dedad4;
    --accent: #ec5230;
    --on-accent: #ffffff;
    --shadow: 0 1px 2px rgba(28,26,24,.06), 0 18px 40px rgba(28,26,24,.13);
    --ui: 'IBM Plex Sans', ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
  }
  :root:not([data-theme="light"]) {
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #191715;
      --bar: #221f1d;
      --ink: #efece7;
      --muted: #968e85;
      --line: #332f2b;
      --sunk: #14120f;
      --accent: #f46b4b;
      --on-accent: #1c1a18;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 18px 44px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #191715;
    --bar: #221f1d;
    --ink: #efece7;
    --muted: #968e85;
    --line: #332f2b;
    --sunk: #14120f;
    --accent: #f46b4b;
    --on-accent: #1c1a18;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 18px 44px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 14px;
  }

  /* ---------- toolbar ---------- */
  .bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 14px;
    height: 52px;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .bar::-webkit-scrollbar { display: none; }

  .tabs, .segs { display: flex; align-items: center; gap: 2px; }
  .segs { background: var(--sunk); border-radius: 8px; padding: 3px; gap: 3px; }

  button {
    font: inherit;
    color: var(--muted);
    background: none;
    border: 0;
    border-radius: 6px;
    padding: 7px 11px;
    cursor: pointer;
    white-space: nowrap;
    transition: color .12s, background-color .12s;
  }
  button:hover { color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .tab[aria-selected="true"] {
    color: var(--ink);
    font-weight: 600;
    box-shadow: inset 0 -2px 0 var(--accent);
    border-radius: 6px 6px 0 0;
  }
  .seg[aria-selected="true"] {
    color: var(--ink);
    background: var(--bar);
    font-weight: 500;
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
  }

  .spacer { flex: 1 1 auto; min-width: 12px; }

  .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--muted);
    white-space: nowrap;
  }
  .readout {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    white-space: nowrap;
    min-width: 74px;
  }
  .icon { padding: 7px 9px; font-size: 15px; line-height: 1; }

  /* ---------- stage ---------- */
  .stage {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    justify-content: center;
    padding: 0;
    overflow: hidden;
  }
  .stage.framed { padding: 22px 16px; }

  .device {
    width: 100%;
    height: 100%;
    background: #fff;
    border: 0;
    display: block;
  }
  .stage.framed .device {
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }

  /* ---------- toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translate(-50%, 14px);
    max-width: min(560px, calc(100vw - 32px));
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 11px 15px;
    background: var(--bar);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 9px;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity .16s, transform .16s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast .u {
    color: var(--ink);
    word-break: break-all;
    font-size: 13px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="bar">
  <div class="tabs" role="tablist" aria-label="Pages"></div>

  <div class="spacer"></div>

  <span class="label">Width</span>
  <div class="segs" role="tablist" aria-label="Viewport width"></div>
  <span class="readout" id="readout"></span>
  <button class="icon" id="reload" title="Reload this page (R)" aria-label="Reload this page">&#8635;</button>
</div>

<div class="stage" id="stage">
  <div class="device" id="device"><iframe id="frame" title="minti site preview"></iframe></div>
</div>

  <span class="u" id="toast-url"></span>
</div>

rySelector('.phone3d');\n      if (!el || !phone) return;\n\n      // Each screenshot gets its own framing (zoom + vertical nudge) so the\n      // phone shows the app screen, not the full marketing poster.\n      const shots = [\n        { src: 'present.png',    s: 1.55, ty: -6 },\n        { src: 'topfriends.png', s: 1.45, ty: -9 },\n        { src: 'candybook.png',  s: 1.5,  ty: -8 },\n        { src: 'remembered.png', s: 1.45, ty: -8 },\n        { src: 'gather.png',     s: 1.45, ty: -8 },\n        { src: 'jar.png',        s: 1.5,  ty: -4 },\n      ];\n\n      shots.forEach(sh => { const im = new Image(); im.src = 'screens/' + sh.src; });\n\n      let i = 0;\n      const apply = (n) => {\n        const sh = shots[n];\n        el.src = 'screens/' + sh.src;\n        el.style.transform = 'scale(' + sh.s + ') translateY(' + sh.ty + '%)';\n      };\n      apply(0);\n\n      // The flip animation is 8.5s; the phone shows its BACK around the middle\n      // of the cycle. animationiteration fires when it returns to the front, so\n      // we swap ~0.54 into the next cycle (back facing) and the new shot is\n      // already in place when it flips forward again.\n      const DUR = 8500;\n      phone.addEventListener('animationiteration', () => {\n        setTimeout(() => { i = (i + 1) % shots.length; apply(i); }, DUR * 0.54);\n      });\n    })();\n  <\/script>\n<\/body>\n<\/html>\n", "minti": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<script>\n(function () {\n  // srcdoc frames share the shell's origin, so the screenshots are read from\n  // the one copy held there rather than inlined into all six pages.\n  var A = (window.parent && window.parent.__MINTI_ASSETS) || {};\n  function map(u) {\n    if (typeof u !== 'string') return u;\n    var m = u.match(/screens\\/([^\\/?#]+)$/);\n    return (m && A[m[1]]) ? A[m[1]] : u;\n  }\n  // index.html swaps the phone screenshot from JS, so map assignments too.\n  var d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, y.html\">Company<\/a>\n        <a class=\"pill\" href=\"https://apps.apple.com/tw/app/minti-lets-be-present/id6791064385\" target=\"_blank\" rel=\"noopener\">Get the app<\/a>\n      <\/nav>\n    <\/div>\n  <\/header>\n\n  <!-- HERO -->\n  <section class=\"hero\">\n    <div class=\"wrap\">\n      <p class=\"eyebrow\">Real friend social<\/p>\n      <h1 class=\"page-title\">Let's be <span class=\"it\">present.<\/span><\/h1>\n      <p class=\"sub center\">minti is real friend social \u2014 a place to find friends, not followers. No feed, no likes, no doomscroll. Just you, the people in front of you, and the time you actually spend together.<\/p>\n      <div class=\"badges center\">\n        <a class=\"badge\" href=\"https://apps.apple.com/tw/app/minti-lets-be-present/id6791064385\" target=\"_blank\" rel=\"noopener\" aria-label=\"Download on the App Store\">\n          <svg viewBox=\"0 0 24 24\" fill=\"#fff\" aria-hidden=\"true\"><path d=\"M16.365 1.43c.05 1.02-.34 2.02-.99 2.74-.68.76-1.78 1.34-2.85 1.26-.09-1 .38-2.04.99-2.72.68-.75 1.86-1.32 2.85-1.28zM19.6 17.06c-.53 1.22-.78 1.76-1.46 2.84-.95 1.5-2.29 3.37-3.95 3.38-1.47.02-1.85-.96-3.85-.95-2 .01-2.42.97-3.9.95-1.66-.02-2.93-1.71-3.88-3.21-2.66-4.2-2.94-9.12-1.3-11.74 1.16-1.85 3-2.93 4.72-2.93 1.76 0 2.86.98 4.31.98 1.41 0 2.27-.98 4.3-.98 1.53 0 3.16.84 4.31 2.28-3.79 2.08-3.17 7.49.6 9.38z\"/><\/svg>\n          <span class=\"b-txt\"><span class=\"b-small\">Download on the<\/span><span class=\"b-big\">App Store<\/span><\/span>\n        <\/a>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <hr class=\"divider\" />\n\n  <!-- PHONES DOWN -->\n  <section>\n    <div class=\"wrap narrow center reveal\">\n      <p class=\"eyebrow\">The whole idea<\/p>\n      <h2 class=\"h\">Phones down. It's kind of the whole point.<\/h2>\n      <p class=\"lead-p\">You know the dinner where everyone's technically there but also\u2026 on their phone? Yeah. We built minti for that dinner. Flip your phone screen-down and minti starts counting your time together. That's it. The less you touch it, the better it works \u2014 possibly the only app that's rooting for you to ignore it.<\/p>\n    <\/div>\n  <\/section>\n\n  <hr class=\"divider\" />\n\n  <!-- 1 \u00b7 GATHER -->\n  <section>\n    <div class=\"wrap split\">\n      <div class=\"copy reveal\">\n        <p class=\"eyebrow\">Step 01 \u00b7 Session<\/p>\n        <h3>Gather your people.<\/h3>\n        <p>One friend hosts, everyone else joins with a single code. Two of you or the whole table \u2014 scan a QR and you're in.<\/p>\n        <p class=\"quote\">Host or join with one code.<\/p>\n      <\/div>\n      <div class=\"visual reveal\"><img class=\"shot\" src=\"data:image/webp;base64,UklGRsJ2AABXRUJQVlA4ILZ2AADwNAKdASpsAj4FPm02lkkkIqUhIjK5yKANiWdu57X44CZTcLxZ46EhZU/Gfudh88r/d/3O/w3v6Wv+6f2z9de0byJ7W8vnl//mf3v8svmN/rf+b/gveD+h/+h/dP3/+gH9RP+J/d/cl/0v2792P96/6PqA/nP9t/9n+m94P/VftT7nf6h/mf2J/0HyAfzr+7f+f2vv+X7Df+J/3H/49wD+hf5T/+eub+3//O+Tn+uf739uPgQ/Zb/+f7L3AP/d6gH/a9QD1l+o/9h/t/7N+Zv9U/vP9//aX++/+72V/Gvon7p/dv2w/uX/w+Cr+38kHof9z5nfx37T/jP7l/mf+f/gP3r+QP9L/i/2085flZ/ieoL+M/zD/Ff4L9z/8Z+9vuo7I7Y/91/0fUF9g/p/+4/wn+Y/7n+l9MH+5/xfqb+p/3z/p/3v4Af5P/Tf9h/evyZ+kP+34O33D/i/uJ8AP8w/uH/m/wX5a/TH/U/+X/S/7j9wfbv+b/6H/z/6H8t/sL/mH9l/5/+C/0nvt///3WfuT///df/cz/9DG9DGm3TPwTTD27gmmHt3BNMPbuCaYe3OYs/95gJbckxh7dwTTD27gmmHt3BKeVGSul4CaYe3cE0w9u4Jph7dwC7ibf9y6lcwDwE0w9u4Jph7dwTTD27gmmHt3BNMPbuCaYe3cE0w9u4Jph7dwTTD27gkjWCyMS919HWY+2JkSLlBOPbTR9/S3nvv8N4tz5cmU+6l9EMYohRHdrQh7zp3TXAfuxT3owq2UclHLchI2wGzPWNbZLOL+MQeAmmHt3BJhw39k5VmLv5V5YYHF0D1h77ZfI8tqqfbkiKZT7siEODgW5DlFBEU1FOKONSEAgxbuaKoJldTkO6oXtsDs+4dRoJzURyMs5BbUcrlKU5LfdwTTD27gmmHi15+Ismj02SufRjSan7gQDlVa/xphc/giu4vMqZOgjC2pwBuBAHhxA+QNfcYDYtH3VhfzIHPyTHIAsMEDB+S3xK/twKlcwDwE0w9u4Jph+SCEzgiJDAsLM3jSIOTfDmU77r+xCnWIYHQg5Cw9qSUCKDBdk5Q2Bg8DI3JqRNRBvss7JMYe3cE0w9u4JL5B8YxiQlE6i/IQ4L2odVIY5Jt6ePjrCucn7D14gWhdUboC3+Pl5Fu8AtbBBTSgfoc0y5Itxk0GZkH7hBu/166AeAmmHt3BNMPbuCcMnEPsJ92W0NklL3jDsJijgZVID5yJFQ13saCCCOLKoFisIx787gxzkV : 1.3rem; margin-bottom: 8px; }\n.value p { color: var(--muted); }\n\n/* cta */\n.cta { text-align: center; }\n.cta h2 { font-size: clamp(2.2rem, 5vw, 3.6rem); margin-bottom: 16px; }\n.cta p { color: var(--muted); max-width: 46ch; margin: 0 auto 30px; font-size: 1.12rem; }\n\n/* letter (postkitty) */\n.letter { background: var(--panel); border-radius: 20px; padding: 34px 30px; box-shadow: 0 30px 60px -40px rgba(0,0,0,0.35); position: relative; max-width: 380px; margin: 0 auto; transform: rotate(-2deg); }\n.letter .stamp { position: absolute; top: 18px; right: 18px; width: 54px; height: 64px; border-radius: 6px; background: repeating-linear-gradient(45deg, var(--accent), var(--accent) 6px, #f07a5e 6px, #f07a5e 12px); box-shadow: 0 0 0 4px #fff, 0 0 0 6px var(--panel-2); }\n.letter .lines { margin-top: 40px; display: flex; flex-direction: column; gap: 12px; }\n.letter .lines span { height: 8px; background: #dfdedb; border-radius: 6px; }\n.letter .lines span:nth-child(1) { width: 60%; }\n.letter .lines span:nth-child(2) { width: 90%; }\n.letter .lines span:nth-child(3) { width: 80%; }\n.letter .lines span:nth-child(4) { width: 40%; }\n.letter .sign { margin-top: 22px; font-family: var(--serif); font-style: italic; font-size: 1.3rem; }\n\n/* app screenshot */\n.shot { width: 100%; max-width: 380px; border-radius: 26px; box-shadow: 0 34px 70px -38px rgba(0,0,0,0.45); display: block; margin: 0 auto; }\n\n/* legal pages (terms / privacy) */\n.legal { max-width: 760px; margin: 0 auto; padding: clamp(48px, 8vh, 80px) 28px clamp(56px, 9vh, 96px); }\n.legal h1 { font-size: clamp(2.2rem, 5vw, 3.2rem); margin-bottom: 8px; }\n.legal .updated { color: var(--faint); font-size: 0.9rem; margin-bottom: 34px; }\n.legal h2 { font-size: 1.4rem; margin-top: 42px; margin-bottom: 12px; }\n.legal p { color: var(--muted); margin-bottom: 14px; line-height: 1.75; }\n.legal ul { color: var(--muted); margin: 0 0 18px 1.2em; line-height: 1.75; }\n.legal li { margin-bottom: 6px; }\n.legal a { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }\n.legal strong { color: var(--ink); font-weight: 700; }\n\n/* homepage-style corner footer (used on content pages too) */\nfooter.corner { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 40px clamp(20px, 4vw, 44px); border-top: 1px solid var(--line); }\nfooter.corner .foot-left { display: flex; flex-direction: column; gap: 4px; font-size: 0.82rem; color: var(--faint); line-height: 1.4; justify-self: start; }\nfooter.corner .foot-left a { color: var(--muted); }\nfooter.corner .foot-left a:hover { color: var(--ink); }\nfooter.corner .foot-center { display: flex; gap: 26px; justify-self: center; font-size: 0.92rem; font-weight: 500; color: var(--muted); }\nfooter.corner .foot-center a:hover { color: var(--ink); }\nfooter.corner .badges { justify-self: end; }\n@media (max-width: 720px) {\n  footer.corner { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 16px; }\n  footer.corner .foot-left { align-items: center; }\n  footer.corner .foot-center { order: -1; flex-wrap: wrap; justify-content: center; gap: 18px; }\n}\n\n/* footer */\nfooter.site { border-top: 1px solid var(--line); padding: 62px 0 40px; }\n.foot-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 30px; }\n@media (max-width: 720px) { .foot-grid { grid-template-columns: 1fr 1fr; gap: 34px; } }\n.foot-brand p { color: var(--muted); margin-top: 12px; font-size: 0.92rem; max-width: 32ch; }\n.foot-col h5 { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin-bottom: 14px; font-weight: 700; font-family: var(--sans); }\n.foot-col a { display: block; margin-bottom: 10px; color: var(--muted); font-size: 0.96rem; }\n.foot-col a:hover { color: var(--ink); }\n.foot-bottom { margin-top: 50px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; color: var(--faint); font-size: 0.86rem; }\n\n/* reveal */\n.reveal { opacity: 0; transform: translateY(20px); transition: opacity .7s ease, transform .7s ease; }\n.reveal.in { opacity: 1; transform: none; }\n@media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } html { scroll-behavior: auto; } }\n\n<\/style>\n<\/head>\n<body>\n\n  <header class=\"nav\">\n    <div class=\"wrap nav-inner\">\n      <a class=\"brand\" href=\"index.html\" aria-label=\"minti home\"><span class=\"logo\" aria-hidden=\"true\"><span class=\"lm\">m<\/span><span class=\"lc\"><i><\/i><i><\/i><\/span><span class=\"lt\">t<\/span><\/span><\/a>\n      <nav class=\"nav-links\">\n        <a class=\"link\" href=\"minti.html\">Intro<\/a>\n        <a class=\"link\" href=\"about.html\">About<\/a>\n        <a class=\"link\" href=\"company.html\">Company<\/a>\n        <a class=\"pill\" href=\"https://apps.apple.com/tw/app/minti-lets-be-present/id6791064385\" target=\"_blank\" rel=\"noopener\">Get the app<\/a>\n      <\/nav>\n    <\/div>\n  <\/header>\n\n  <main class=\"legal\">\n    <h1>Privacy Policy<\/h1>\n    <p class=\"updated\">Effective as of 2026-07-09<\/p>\n\n    <p>This privacy policy applies to the Minti app for mobile devices and web browsers, together with any related services operated by Wen-Chien, Wu (collectively, the \"Application\"). Wen-Chien, Wu is hereby referred to as the \"Service Provider\".<\/p>\n\n    <h2>Information Collection and Use<\/h2>\n    <p>The Application collects information when you download and use it. This information may include information such as<\/p>\n    <ul>\n      <li>Your device's Internet Protocol address<\/li>\n      <li>The pages of the Application that you visit, the time and date of your visit, the time spent on those pages<\/li>\n      <li>The time spent on the Application<\/li>\n      <li>your operating system you use<\/li>\n    <\/ul>\n\n    <h2>Cookies and tracking technologies<\/h2>\n    <p>The Application or its third-party SDKs may use cookies, SDKs, pixels, and similar technologies to support functionality, analytics, or service delivery. Where required by applicable law, the Service Provider will obtain consent before using non-essential tracking technologies.<\/p>\n\n    <h2>Location Information<\/h2>\n    <p>The Application collects your device's location to provide location-based features, improve the Application, and support related services.<\/p>\n    <ul>\n      <li><strong>Geolocation Services:<\/strong> The Service Provider may use location data to provide location-based features or content.<\/li>\n      <li><strong>Analytics and Improvements:<\/strong> Aggregated location data may help the Service Provider understand usage patterns and improve performance.<\/li>\n      <li><strong>Third-Party Services:<\/strong> Location data may be shared with third-party services used to support Application functionality, subject to this privacy policy and applicable law.<\/li>\n    <\/ul>\n\n    <h2>Your Rights<\/h2>\n    <p>You may request access to, correction of, or deletion of your personal data held by the Service Provider. To exercise these rights, or to withdraw consent where processing is based on consent, contact the Service Provider at <a href=\"mailto:service@circlefive.co\">service@circlefive.co<\/a>.<\/p>\n\n    <h2>Your California privacy rights (CCPA/CPRA)<\/h2>\n    <p>If you are a California resident, you have the right to know what personal information is collected, the right to delete personal information, the right to opt out of the sale or sharing of personal information, and the right to non-discrimination for exercising these rights. To exercise your CCPA/CPRA rights, contact the Service Provider at <a href=\"mailto:service@circlefive.co\">service@circlefive.co<\/a>.<\/p>\n    <p>The Service Provider may use the information you provide to send important information, required notices, and, where permitted by law, marketing communications.<\/p>\n    <p>For a better experience while using the Application, the Service Provider may require you to provide certain personally identifiable information, including but not limited to Email, userid. The information the Service Provider requests will be retained and used as described in this privacy policy.<\/p>\n\n    <h2>Third Party Access<\/h2>\n    <p>Only aggregated, anonymized data is periodically transmitted to external services to aid the Service Provider in improving the Application and their service. The Service Provider may share your information with third parties in the ways that are described in this privacy statement.<\/p>\n\n    <h2>International Data Transfers<\/h2>\n    <p>The Service Provider or its third-party service providers may transfer personal data to countries outside your country of residence, including outside the European Economic Area (EEA). Where applicable law requires safeguards for international transfers, the Service Provider will use appropriate mechanisms.<\/p>\n    <ul>\n      <li>Standard Contractual Clauses (SCCs) approved by the European Commission<\/li>\n      <li>Adequacy decisions or other legally recognized transfer mechanisms<\/li>\n      <li>Your consent, where required and legally permitted<\/li>\n    <\/ul>\n    <p>Data protection laws in other countries may differ from those in your jurisdiction. Where required by law, the Service Provider will apply appropriate safeguards and obtain any consent required for the transfer.<\/p>\n    <p>Please note that the Application utilizes third-party services that have their own Privacy Policy about handling data. Below are the links to the Privacy Policy of the third-party service providers used by the Application:<\/p>\n    <ul>\n      <li>Google Analytics for Firebase<\/li>\n      <li>Firebase Crashlytics<\/li>\n    <\/ul>\n    <p>The Service Provider may disclose User Provided and Automatically Collected Information:<\/p>\n    <ul>\n      <li>as required by law, such as to comply with a subpoena, or similar legal process;<\/li>\n      <li>when they believe in good faith that disclosure is necessary to protect their rights, protect your safety or the safety of others, investigate fraud, or respond to a government request;<\/li>\n      <li>with their trusted services providers who work on their behalf, do not have an independent use of the information the Service Provider discloses to them, and have agreed to adhere to the rules set forth in this privacy statement.<\/li>\n    <\/ul>\n\n    <h2>Opt-Out Rights<\/h2>\n    <p>You can stop further collection of information from your mobile device or computer by uninstalling the Application. Uninstalling will stop the Application from collecting data from your device, but it does not automatically delete information that has already been transmitted to the Service Provider or to third parties.<\/p>\n    <p>You can stop further collection of information from your device by ceasing to use the website. Ceasing to use will stop the website from collecting data from your device, but it does not automatically delete information that has already been transmitted to the Service Provider or to third parties.<\/p>\n    <p>To request deletion of your personal data, to withdraw consent, or to exercise any of your rights, contact the Service Provider at <a href=\"mailto:service@circlefive.co\">service@circlefive.co<\/a>.<\/p>\n\n    <h2>Data Retention Policy<\/h2>\n    <p>The Service Provider retains personal data based on its necessity for the stated purposes:<\/p>\n    <ul>\n      <li>User Provided Data: Retained for the duration of your use of the Application plus 12 months thereafter, unless longer retention is required by law<\/li>\n      <li>Automatically Collected Data: Retained for up to 24 months from collection, unless longer retention is required for legal compliance<\/li>\n      <li>Aggregated and Anonymized Data: Retained indefinitely as it no longer identifies you<\/li>\n      <li>Data required for legal compliance: Retained as long as required by applicable law<\/li>\n    <\/ul>\n    <p>You may request deletion of your personal data, subject to any legal obligation to retain it. If you want the Service Provider to delete User Provided Data submitted through the Application, please contact them at <a href=\"mailto:service@circlefive.co\">service@circlefive.co<\/a>. Please note that some User Provided Data may be required for the Application to function properly.<\/p>\n\n    <h2>Data Deletion<\/h2>\n    <p>You can request deletion of your personal data or account by contacting the Service Provider at <a href=\"mailto:service@circlefive.co\">service@circlefive.co<\/a>. The Service Provider will process your request within the timeframes required by applicable law.<\/p>\n    <p>Upon verification of your identity, the Service Provider will delete your personal data from its systems, except where retention is required for legal compliance or legitimate business purposes.<\/p>\n\n    <h2>Children<\/h2>\n    <p>The Application is not intended for children under 13 years of age, or such higher age as required by applicable law. The Service Provider does not knowingly solicit data from children or market the Application to them.<\/p>\n    <p>Where parental or guardian consent is required under applicable law, the Application is not intended for use without that consent. The Service Provider does not knowingly collect personally identifiable information from children under 13 years of age in violation of applicable law. In the event the Service Provider discovers that a child has provided personal information, the Service Provider will immediately delete this from their servers. If you are a parent or guardian and you are aware that your child has provided the Service Provider with personal information, please contact the Service Provider (<a href=\"mailto:service@circlefive.co\">service@circlefive.co<\/a>) so that they will be able to take the necessary actions.<\/p>\n\n    <h2>Security<\/h2>\n    <p>The Service Provider is concerned about safeguarding the confidentiality of your information. The Service Provider provides physical, electronic, and procedural safeguards to protect information the Service Provider processes and maintains.<\/p>\n\n    <h2>Data Breach Notification<\/h2>\n    <p>If a data breach occurs that affects your personal data, the Service Provider will notify you in accordance with applicable legal requirements, including, where required, providing information about the nature of the breach and the steps being taken to address it.<\/p>\n\n    <h2>Changes<\/h2>\n    <p>The Service Provider may update this Privacy Policy from time to time. The Service Provider will notify you of material changes by posting the updated Privacy Policy with an effective date. Where required by law, the Service Provider will seek your consent to material changes before they take effect.<\/p>\n    <p>Previous versions of this Privacy Policy will be maintained and made available upon request by contacting the Service Provider at <a href=\"mailto:service@circlefive.co\">service@circlefive.co<\/a>.<\/p>\n    <p>This privacy policy is effective as of 2026-07-09<\/p>\n\n    <h2>Your Consent<\/h2>\n    <p>Where processing is based on consent, you provide that consent by affirmatively opting in to the relevant feature or action. You may withdraw consent at any time without affecting processing carried out before withdrawal. Processing based on other lawful bases is carried out as described above.<\/p>\n\n    <h2>Contact Us<\/h2>\n    <p>If you have any questions regarding privacy while using the Application, or have questions about the practices, please contact the Service Provider via email at <a href=\"mailto:service@circlefive.co\">service@circlefive.co<\/a>.<\/p>\n  <\/main>\n\n  <footer class=\"site\">\n    <div class=\"wrap\">\n      <div class=\"foot-grid\">\n        <div class=\"foot-brand\">\n          <a class=\"brand\" href=\"index.html\"><span class=\"mark\"><\/span> circlefive<\/a>\n          <p>Apps that bring people together \u2014 around real relationships, not follower counts.<\/p>\n        <\/div>\n        <div class=\"foot-col\"><h5>Products<\/h5><a href=\"minti.html\">minti<\/a><\/div>\n        <div class=\"foot-col\"><h5>Company<\/h5><a href=\"about.html\">About<\/a><a href=\"company.html\">Company<\/a><\/div>\n        <div class=\"foot-col\"><h5>Legal<\/h5><a href=\"terms.html\">Terms<\/a><a href=\"privacy.html\">Privacy<\/a><\/div>\n      <\/div>\n      <div class=\"foot-bottom\">\n        <span>\u00a9 2026 Circle Five Studios, Inc.<\/span>\n        <span>Made for the people in front of you.<\/span>\n      <\/div>\n    <\/div>\n  <\/footer>\n<\/body>\n<\/html>\n"};
  var LABELS = {"index": "Home", "minti": "Intro", "about": "About", "company": "Company", "terms": "Terms", "privacy": "Privacy"};

  var WIDTHS = [
    { id: 'phone',   name: 'Phone',   w: 390 },
    { id: 'tablet',  name: 'Tablet',  w: 834 },
    { id: 'desktop', name: 'Desktop', w: 1280 },
    { id: 'fit',     name: 'Fit',     w: 0 }
  ];

  var frame = document.getElementById('frame');
  var device = document.getElementById('device');
  var stage = document.getElementById('stage');
  var readout = document.getElementById('readout');
  var toast = document.getElementById('toast');
  var order = Object.keys(PAGES);
  var current = order[0];
  var width = 'fit';
  var pendingHash = '';

  // ---- build the toolbar controls ----
  var tabs = document.querySelector('.tabs');
  order.forEach(function (name) {
    var b = document.createElement('button');
    b.className = 'tab';
    b.type = 'button';
    b.role = 'tab';
    b.textContent = LABELS[name] || name;
    b.onclick = function () { show(name); };
    b.dataset.page = name;
    tabs.appendChild(b);
  });

  var segs = document.querySelector('.segs');
  WIDTHS.forEach(function (d) {
    var b = document.createElement('button');
    b.className = 'seg';
    b.type = 'button';
    b.role = 'tab';
    b.textContent = d.name;
    b.onclick = function () { setWidth(d.id); };
    b.dataset.w = d.id;
    segs.appendChild(b);
  });

  function setWidth(id) {
    width = id;
    var d = WIDTHS.filter(function (x) { return x.id === id; })[0];
    var fit = !d.w;
    stage.classList.toggle('framed', !fit);
    device.style.width = fit ? '100%' : d.w + 'px';
    device.style.maxWidth = '100%';
    Array.prototype.forEach.call(segs.children, function (b) {
      b.setAttribute('aria-selected', String(b.dataset.w === id));
    });
    measure();
  }

  function measure() {
    readout.textContent = Math.round(device.getBoundingClientRect().width) + ' px';
  }

  function show(name, hash) {
    if (!PAGES[name]) return;
    current = name;
    pendingHash = hash || '';
    Array.prototype.forEach.call(tabs.children, function (b) {
      b.setAttribute('aria-selected', String(b.dataset.page === name));
    });
    frame.srcdoc = PAGES[name];
  }

  frame.addEventListener('load', function () {
    if (!pendingHash) return;
    try {
      var t = frame.contentDocument.querySelector(pendingHash);
      if (t) t.scrollIntoView();
    } catch (e) { /* nothing to scroll to */ }
    pendingHash = '';
  });

  var toastTimer;
  window.addEventListener('message', function (e) {
    var m = e.data || {};
    if (m.t === 'nav') {
      show(m.page, m.hash);
    } else if (m.t === 'ext') {
      // The preview is sandboxed, so offsite links report their destination
      // instead of navigating -- which is what you want to check anyway.
      document.getElementById('toast-url').textContent = m.href;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 4200);
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= order.length) { show(order[n - 1]); return; }
    if (e.key === 'r' || e.key === 'R') { show(current); }
  });

  document.getElementById('reload').onclick = function () { show(current); };
  window.addEventListener('resize', measure);

  setWidth('fit');
  show(current);
</script>
