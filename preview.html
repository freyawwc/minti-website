<title>minti Site Preview</title>

<style>
  /* Shell palette: warm neutrals pulled toward the site's own #ec5230 so the
     harness reads as related to minti but never competes with the page inside. */
  :root {
    --ground: #e9e6e1;
    --bar: #fcfbfa;
    --ink: #1c1a18;
    --muted: #7b746c;
    --line: #d9d5ce;
    --sunk: #dedad4;
    --accent: #ec5230;
    --on-accent: #ffffff;
    --shadow: 0 1px 2px rgba(28,26,24,.06), 0 18px 40px rgba(28,26,24,.13);
    --ui: 'IBM Plex Sans', ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
  }
  :root:not([data-theme="light"]) {
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #191715;
      --bar: #221f1d;
      --ink: #efece7;
      --muted: #968e85;
      --line: #332f2b;
      --sunk: #14120f;
      --accent: #f46b4b;
      --on-accent: #1c1a18;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 18px 44px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #191715;
    --bar: #221f1d;
    --ink: #efece7;
    --muted: #968e85;
    --line: #332f2b;
    --sunk: #14120f;
    --accent: #f46b4b;
    --on-accent: #1c1a18;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 18px 44px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 14px;
  }

  /* ---------- toolbar ---------- */
  .bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 14px;
    height: 52px;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .bar::-webkit-scrollbar { display: none; }

  .tabs, .segs { display: flex; align-items: center; gap: 2px; }
  .segs { background: var(--sunk); border-radius: 8px; padding: 3px; gap: 3px; }

  button {
    font: inherit;
    color: var(--muted);
    background: none;
    border: 0;
    border-radius: 6px;
    padding: 7px 11px;
    cursor: pointer;
    white-space: nowrap;
    transition: color .12s, background-color .12s;
  }
  button:hover { color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .tab[aria-selected="true"] {
    color: var(--ink);
    font-weight: 600;
    box-shadow: inset 0 -2px 0 var(--accent);
    border-radius: 6px 6px 0 0;
  }
  .seg[aria-selected="true"] {
    color: var(--ink);
    background: var(--bar);
    font-weight: 500;
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
  }

  .spacer { flex: 1 1 auto; min-width: 12px; }

  .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--muted);
    white-space: nowrap;
  }
  .readout {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    white-space: nowrap;
    min-width: 74px;
  }
  .icon { padding: 7px 9px; font-size: 15px; line-height: 1; }

  /* ---------- stage ---------- */
  .stage {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    justify-content: center;
    padding: 0;
    overflow: hidden;
  }
  .stage.framed { padding: 22px 16px; }

  .device {
    width: 100%;
    height: 100%;
    background: #fff;
    border: 0;
    display: block;
  }
  .stage.framed .device {
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }

  /* ---------- toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translate(-50%, 14px);
    max-width: min(560px, calc(100vw - 32px));
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 11px 15px;
    background: var(--bar);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 9px;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity .16s, transform .16s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast .u {
    color: var(--ink);
    word-break: break-all;
    font-size: 13px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="bar">
  <div class="tabs" role="tablist" aria-label="Pages"></div>

  <div class="spacer"></div>

  <span class="label">Width</span>
  <div class="segs" role="tablist" aria-label="Viewport width"></div>
  <span class="readout" id="readout"></span>
  <button class="icon" id="reload" title="Reload this page (R)" aria-label="Reload this page">&#8635;</button>
</div>

<div class="stage" id="stage">
  <div class="device" id="device"><iframe id="frame" title="minti site preview"></iframe></div>
</div>

  <span class="u" id="toast-url"></span>
</div>

  var PAGES = {"index": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<script>\n(function () {\n  // srcdoc frames share the shell's origin, so the screenshots are read from\n  // the one copy held there rather than inlined into all six pages.\n  var A = (window.parent && window.parent.__MINTI_ASSETS) || {};\n  function map(u) {\n    if (typeof u !== 'string') return u;\n    var m = u.match(/(?:screens|hero-anim)\\/([^\\/?#]+)$/);\n    return (m && A[m[1]]) ? A[m[1]] : u;\n  }\n  // index.html swaps the phone screenshot from JS, so map assignments too.\n  var d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');\n  Object.defineProperty(HTMLImageElement.prototype, 'src', {\n    configurable: true,\n    get: function () { return d.get.call(this); },\n    set: function (v) { d.set.call(this, map(v)); }\n  });\n\n  document.addEventListener('click', function (e) {\n    var a = e.target.closest && e.target.closest('a[href]');\n    if (!a) return;\n    var href = a.getAttribute('href');\n    if (!href || href.charAt(0) === '#') return;      // in-page anchors work as-is\n    if (/^(https?:|mailto:)/i.test(href)) {           // offsite: report, don't leave\n      e.preventDefault();\n      parent.postMessage({ t: 'ext', href: href }, '*');\n      return;\n    }\n    var m = href.match(/^([\\w-]+)\\.html(#.*)?$/);\n    if (m) {\n      e.preventDefault();\n      parent.postMessage({ t: 'nav', page: m[1], hash: m[2] || '' }, '*');\n    }\n  });\n\n  parent.postMessage({ t: 'ready', title: document.title }, '*');\n})();\n<\/script>\n\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>minti \u2014 Real friend social<\/title>\n  <meta name=\"description\" content=\"minti is real friend social \u2014 the app that starts when you put your phone down. Made by Circle Five Studios.\" />\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n  <link rel=\"preconnect\" href=\"https://  }\n    .logo .lc i { width: 0.2em; height: 0.2em; border-radius: 50%; background: var(--accent); }\n    .topbar nav { display: flex; gap: 26px; font-size: 0.95rem; color: var(--muted); font-weight: 500; }\n    .topbar nav a:hover { color: var(--ink); }\n    @media (max-width: 480px) { .topbar nav { gap: 16px; font-size: 0.9rem; } }\n\n    /* ---------- Stage (center) ---------- */\n    .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(20px, 3.5vh, 40px); padding: 0 20px; text-align: center; min-height: 0; }\n    .headline { font-family: var(--serif); font-weight: 400; font-size: clamp(2rem, 5.4vw, 4.2rem); line-height: 1.06; letter-spacing: -0.01em; }\n    .headline .it { color: var(--accent); }\n\n    /* ---------- Key-feature animation (looping, vanilla JS) ---------- */\n    .kf-wrap {\n      --kfh: min(52vh, 520px);\n      --kfw: min(92vw, calc(var(--kfh) * 16 / 9));\n      width: var(--kfw); height: calc(var(--kfw) * 9 / 16);\n      position: relative; overflow: hidden; border-radius: 28px;\n      box-shadow: 0 40px 80px -40px rgba(0,0,0,0.42);\n      background: #E6E4D8;\n    }\n    .kf-stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform-origin: top left; font-family: var(--sans); }\n    .kf-vignette, .kf-flash { position: absolute; inset: 0; }\n    .kf-vignette { background: radial-gradient(circle at 50% 42%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 62%); }\n    .kf-flash { background: #fff; opacity: 0; pointer-events: none; }\n    .kf-cam { position: absolute; inset: 0; }\n\n    .kf-radar { position: absolute; left: 960px; top: 540px; opacity: 0; }\n    .kf-ring { position: absolute; border-radius: 50%; }\n    .kf-ring.d1 { left: -450px; top: -450px; width: 900px; height: 900px; border: 2px dashed rgba(17,66,150,0.16); }\n    .kf-ring.d2 { left: -330px; top: -330px; width: 660px; height: 660px; border: 2px solid rgba(17,66,150,0.12); }\n    .kf-ring.d3 { l ter; justify-content: center; font: 800 17px var(--sans); color: var(--bg); }\n    .kf-you-chip .lb { height: 15px; text-align: center; font-family: var(--hand); font-size: 13px; color: var(--accent); line-height: 15px; }\n    .kf-pill { padding: 9px 0; background: var(--ink); border-radius: 999px; text-align: center; font: 700 12px var(--sans); color: var(--bg); letter-spacing: -0.2px; box-shadow: 0 3px 10px rgba(17,66,150,0.22); }\n    .kf-back-cam { position: absolute; left: 16px; top: 16px; width: 62px; height: 62px; border-radius: 18px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.13); }\n    .kf-back-cam i { position: absolute; width: 20px; height: 20px; border-radius: 50%; background: #0C1E3E; border: 2px solid rgba(255,255,255,0.16); }\n    .kf-back-cam i:nth-child(1) { left: 9px; top: 9px; }\n    .kf-back-cam i:nth-child(2) { left: 33px; top: 33px; }\n    .kf-back-mark { position: absolute; left: 0; right: 0; top: 50%; margin-top: -12px; text-align: center; font: 800 24px var(--sans); color: rgba(250,249,241,0.30); letter-spacing: -1px; }\n    .kf-back-mark span { color: rgba(246,110,34,0.55); }\n    .kf-back-sheen { position: absolute; inset: 0; background: linear-gradient(122deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0) 42%); }\n    .kf-tag { position: absolute; left: 50%; top: 50%; white-space: nowrap; margin-left: -40px; font-family: var(--hand); font-size: 26px; color: var(--accent); opacity: 0; }\n    .kf-ready { position: absolute; left: 50%; top: 50%; margin-left: -46px; padding: 5px 12px; background: #7AE582; border: 1.5px solid rgba(17,66,150,0.18); border-radius: 999px; font: 700 12px var(--sans); letter-spacing: 1.4px; color: var(--ink); white-space: nowrap; opacity: 0; }\n\n    .kf-polaroid { position: absolute; left: 728px; top: 208px; width: 464px; height: 552px; background: var(--bg); padding: 20px 20px 0; box-sizing: border-box; box-shadow: 0 26px 60px rgba(17,66,150,0.22); opacity: 0; }\n    .kf-polaroid . ine);\n  border-radius: 20px;\n  padding: 32px 28px;\n  text-align: left;\n}\n.card .eyebrow { margin-bottom: 14px; }\n.card h3 { font-size: 1.3rem; line-height: 1.2; margin-bottom: 12px; }\n.card p { color: var(--muted); }\n.card p + p { margin-top: 10px; }\n\n/* closing call to action, sat inside a card like kominapp's \u2014\n   the card is centred on the page and its contents centred within it. */\n.cta-card {\n  background: var(--panel);\n  border: 1px solid var(--line);\n  border-radius: 24px;\n  padding: clamp(36px, 6vw, 60px);\n  max-width: 760px;\n  margin: 0 auto;\n  text-align: center;\n}\n.cta-card h2 { font-size: clamp(1.9rem, 4vw, 2.8rem); margin-bottom: 14px; }\n.cta-card p { color: var(--muted); font-size: 1.1rem; max-width: 48ch; margin: 0 auto 28px; }\n.cta-card .badges { justify-content: center; }\n\n/* ---------- narrative carousel ---------- */\n.carousel { position: relative; }\n.carousel-track {\n  display: flex;\n  gap: 24px;\n  overflow-x: auto;\n  scroll-snap-type: x mandatory;\n  scroll-behavior: smooth;\n  padding: 6px max(28px, calc((100% - 620px) / 2)) 12px;\n  scrollbar-width: none;\n  -webkit-overflow-scrolling: touch;\n}\n.carousel-track::-webkit-scrollbar { display: none; }\n\n.carousel-card {\n  flex: 0 0 min(100%, 620px);\n  scroll-snap-align: center;\n  background: var(--panel);\n  border: 1px solid var(--line);\n  border-radius: 26px;\n  padding: 38px 34px 40px;\n  text-align: left;\n  transition: opacity .35s ease;\n}\n/* neighbours dim only once the script is driving the carousel */\n.carousel.is-ready .carousel-card { opacity: 0.5; }\n.carousel.is-ready .carousel-card.is-active { opacity: 1; }\n\n.carousel-card > * { margin: 0; }\n.carousel-card .eyebrow { margin-bottom: 12px; }\n.carousel-card h3 { font-size: clamp(1.5rem, 3vw, 2rem); margin-bottom: 20px; }\n.carousel-card .statement { font-size: 1.18rem; margin: 20px 0 8px; }\n.carousel-card h3 + .statement { margin-top: 0; }\n.carousel-card .lead-p { font-size: 1.04rem; }\ in-top: 22px; font-family: var(--hand); color: var(--accent); font-size: 1.5rem; }\n\n/* app screenshot */\n.shot { width: 100%; max-width: 380px; border-radius: 26px; box-shadow: 0 34px 70px -38px rgba(0,0,0,0.45); display: block; margin: 0 auto; }\n\n/* legal pages (terms / privacy) */\n.legal { max-width: 760px; margin: 0 auto; padding: clamp(48px, 8vh, 80px) 28px clamp(56px, 9vh, 96px); }\n.legal h1 { font-size: clamp(2.2rem, 5vw, 3.2rem); margin-bottom: 8px; }\n.legal .updated { color: var(--faint); font-size: 0.9rem; margin-bottom: 34px; }\n.legal h2 { font-size: 1.4rem; margin-top: 42px; margin-bottom: 12px; }\n.legal p { color: var(--muted); margin-bottom: 14px; line-height: 1.75; }\n.legal ul { color: var(--muted); margin: 0 0 18px 1.2em; line-height: 1.75; }\n.legal li { margin-bottom: 6px; }\n.legal a { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }\n.legal strong { color: var(--ink); font-weight: 700; }\n\n/* homepage-style corner footer (used on content pages too) */\nfooter.corner { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 40px clamp(20px, 4vw, 44px); border-top: 1px solid var(--line); }\nfooter.corner .foot-left { display: flex; flex-direction: column; gap: 4px; font-size: 0.82rem; color: var(--faint); line-height: 1.4; justify-self: start; }\nfooter.corner .foot-left a { color: var(--muted); }\nfooter.corner .foot-left a:hover { color: var(--ink); }\nfooter.corner .foot-center { display: flex; gap: 26px; justify-self: center; font-size: 0.92rem; font-weight: 500; color: var(--muted); }\nfooter.corner .foot-center a:hover { color: var(--ink); }\nfooter.corner .badges { justify-self: end; }\n@media (max-width: 720px) {\n  footer.corner { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 16px; }\n  footer.corner .foot-left { align-items: center; }\n  footer.corner .foot-center { order: -1; flex-wrap: wrap; justify-content: center; gap: 18px; }\n}\n\n/* footer */\nfooter.site { border-top: 1px solid var(--line); padding: 62px 0 40px; }\n.foot-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 30px; }\n@media (max-width: 720px) { .foot-grid { grid-template-columns: 1fr 1fr; gap: 34px; } }\n.foot-brand p { color: var(--muted); margin-top: 12px; font-size: 0.92rem; max-width: 32ch; }\n.foot-col h5 { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin-bottom: 14px; font-weight: 700; font-family: var(--sans); }\n.foot-col a { display: block; margin-bottom: 10px; color: var(--muted); font-size: 0.96rem; }\n.foot-col a:hover { color: var(--ink); }\n.foot-bottom { margin-top: 50px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; color: var(--faint); font-size: 0.86rem; }\n\n/* reveal */\n.reveal { opacity: 0; transform: translateY(20px); transition: opacity .7s ease, transform .7s ease; }\n.reveal.in { opacity: 1; transform: none; }\n@media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } html { scroll-behavior: auto; } }\n\n<\/style>\n<\/head>\n<body>\n\n  <!-- NAV -->\n  <header class=\"nav\">\n    <div class=\"wrap nav-inner\">\n      <a class=\"brand\" href=\"index.html\" aria-label=\"minti home\"><span class=\"logo\" aria-hidden=\"true\"><span class=\"lm\">m<\/span><span class=\"lc\"><i><\/i><i><\/i><\/span><span class=\"lt\">t<\/span><\/span><\/a>\n      <nav class=\"nav-links\">\n        <a class=\"link\" href=\"index.html\">minti<\/a>\n        <a class=\"link active\" href=\"about.html\">about<\/a>\n        <a class=\"link\" href=\"company.html\">company<\/a>\n        <a class=\"pill\" href=\"https://apps.apple.com/tw/app/minti-lets-be-present/id6791064385\" target=\"_blank\" rel=\"noopener\">Get the app<\/a>\n      <\/nav>\n    <\/div>\n  <\/header>\n\n  <!-- HERO -->\n  <section class=\"hero\">\n    <div class=\"wrap left\">\n      <div class=\"prose\">\n        <h1 class=\"page-title\">put your phone down. keep the moment.<\/h1>\n        <p class=\"lead-p\">minti turns time together into memories you can actually keep.<\/p>\n        <div class=\"badges\">\n          <a class=\"badge\" href=\"https://apps.apple.com/tw/app/minti-lets-be-present/id6791064385\" target=\"_blank\" rel=\"noopener\" aria-label=\"Download on the App Store\">\n            <svg viewBox=\"0 0 24 24\" fill=\"#fff\" aria-hidden=\"true\"><path d=\"M16.365 1.43c.05 1.02-.34 2.02-.99 2.74-.68.76-1.78 1.34-2.85 1.26-.09-1 .38-2.04.99-2.72.68-.75 1.86-1.32 2.85-1.28zM19.6 17.06c-.53 1.22-.78 1.76-1.46 2.84-.95 1.5-2.29 3.37-3.95 3.38-1.47.02-1.85-.96-3.85-.95-2 .01-2.42.97-3.9.95-1.66-.02-2.93-1.71-3.88-3.21-2.66-4.2-2.94-9.12-1.3-11.74 1.16-1.85 3-2.93 4.72-2.93 1.76 0 2.86.98 4.31.98 1.41 0 2.27-.98 4.3-.98 1.53 0 3.16.84 4.31 2.28-3.79 2.08-3.17 7.49.6 9.38z\"/><\/svg>\n            <span class=\"b-txt\"><span class=\"b-small\">Download on the<\/span><span class=\"b-big\">App Store<\/span><\/span>\n          <\/a>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <hr class=\"divider\" />\n\n  <!-- BE THERE NOW -->\n  <section>\n    <div class=\"wrap left reveal\">\n      <div class=\"prose\">\n        <p class=\"eyebrow\">why minti<\/p>\n        <h2 class=\"h\">be there now. remember it later.<\/h2>\n        <p class=\"lead-p\">Your phone captures everything \u2014 photos, messages, stories, streaks.<\/p>\n        <p class=\"lead-p\">But it can't capture what it felt like to be together.<\/p>\n        <p class=\"statement\">minti helps you make space for that.<\/p>\n        <p class=\"lead-p\">Start a session with your friends, flip your phones face down, and be there.<\/p>\n        <p class=\"lead-p\">Talk, laugh, eat, study, wander \u2014 whatever you came to do.<\/p>\n        <p class=\"lead-p\">The timer tracks the time you chose to spend together. No likes, followers, or doomscrolling.<\/p>\n        <p class=\"murmur\">Just your people. Just being there.<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <hr class=\"divider\" />\n\n  <!-- MAKE THE MOMENT COUNT -->\n  <section>\n    <div class=\"wrap left reveal\">\n      <div class=\"prose\">\n        <p class=\"eyebrow\">the memory<\/p>\n        <h2 class=\"h\">make the moment count.<\/h2>\n        <p class=\"lead-p\">When your session ends, take a photo on your phone.<\/p>\n        <p class=\"lead-p\">Everyone captures the moment from their own perspective, and all the photos come together in one shared session.<\/p>\n        <p class=\"lead-p\">Together, they become a <strong>candy<\/strong> \u2014 a small memory from your time together.<\/p>\n        <p class=\"lead-p\">Everyone gets the candy on their own phone and can drop it into a personal jar.<\/p>\n        <p class=\"lead-p\">Sort your jars by people, places, eras, inside jokes \u2014 whatever feels right.<\/p>\n        <p class=\"lead-p\">Because it's not just about what the moment looked like.<\/p>\n        <p class=\"statement\">It's about what it felt like to be there.<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <hr class=\"divider\" />\n\n  <!-- STATS -->\n  <section>\n    <div class=\"wrap reveal\">\n      <div class=\"stats\">\n        <div class=\"stat\">\n          <p class=\"stat-label\">time together<\/p>\n          <p class=\"stat-num\">&#8734;<\/p>\n          <p class=\"stat-caption\">moments you actually shared<\/p>\n        <\/div>\n        <div class=\"stat\">\n          <p class=\"stat-label\">candies collected<\/p>\n          <p class=\"stat-num\">&#8734;<\/p>\n          <p class=\"stat-caption\">little pieces of your life<\/p>\n        <\/div>\n        <div class=\"stat\">\n          <p class=\"stat-label\">friends<\/p>\n          <p class=\"stat-num\">&#8734;<\/p>\n          <p class=\"stat-caption\">stories still being written<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <hr class=\"divider\" />\n\n  <!-- HOW IT WORKS \u2014 four cards -->\n  <section>\n    <div class=\"wrap\">\n      <div class=\"sec-intro left reveal\">\n        <h2 class=\"h\">how it works<\/h2>\n      <\/div>\n\n      <div class=\"cards cards-4 reveal\">\n        <article class=\"card\">\n          <p class=\"eyebrow\">01 \u00b7 flip<\/p>\n          <h3>Start a session with your friends and flip your phones face down.<\/h3>\n          <p>The timer tracks the time you're actually together.<\/p>\n        <\/article>\n\n        <article class=\"card\">\n          <p class=\"eyebrow\">02 \u00b7 capture<\/p>\n          <h3>When the session ends, take a photo.<\/h3>\n          <p>Everyone's photos come together in the same shared session.<\/p>\n        <\/article>\n\n        <article class=\"card\">\n          <p class=\"eyebrow\">03 \u00b7 keep<\/p>\n          <h3>Your session becomes a candy.<\/h3>\n          <p>Drop it into any personal jar you choose \u2014 by person, place, era, inside joke, or whatever feels right.<\/p>\n        <\/article>\n\n        <article class=\"card\">\n          <p class=\"eyebrow\">04 \u00b7 shake<\/p>\n          <h3>Shake your jar to reveal a memory.<\/h3>\n          <p>Poke your friends when you want to remind them of the good times you shared together.<\/p>\n        <\/article>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <hr class=\"divider\" />\n\n  <!-- SOCIAL, IN REAL LIFE -->\n  <section>\n    <div class=\"wrap left reveal\">\n      <div class=\"prose\">\n        <p class=\"eyebrow\">your friendship history<\/p>\n        <h2 class=\"h\">social, in real life.<\/h2>\n        <p class=\"lead-p\">Most apps help you share with everyone else.<\/p>\n        <p class=\"statement\">minti helps you remember the people right in front of you.<\/p>\n        <div class=\"stanza\">\n          <p>No profiles to perfect.<\/p>\n          <p>No feeds to keep up with.<\/p>\n          <p>No followers to impress.<\/p>\n        <\/div>\n        <p class=\"lead-p\">Just a shared history of the moments that make your friendship \u2014 organised in a way that feels personal to you.<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <hr class=\"divider\" />\n\n  <!-- REMEMBER MORE THAN THE PHOTO -->\n  <section>\n    <div class=\"wrap left reveal\">\n      <div class=\"prose\">\n        <p class=\"eyebrow\">one day<\/p>\n        <h2 class=\"h\">remember more than the photo.<\/h2>\n        <p class=\"lead-p\">One day, you won't remember every conversation.<\/p>\n        <div class=\"stanza\">\n          <p>You'll remember the dinner that ran too long.<\/p>\n          <p>The road trip with no plan.<\/p>\n          <p>The random Tuesday that became a core memory.<\/p>\n        <\/div>\n        <p class=\"lead-p\">minti helps you be present for those moments, keep a little piece of them, and come back whenever you miss them.<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- CLOSING CTA \u2014 a single centred card, like kominapp's -->\n  <section id=\"download\">\n    <div class=\"wrap reveal\">\n      <div class=\"cta-card\">\n        <h2>Make Time Together<\/h2>\n        <p>Put your phone down. Find your people. Be there. Try minti.<\/p>\n        <div class=\"badges\">\n          <a class=\"badge\" href=\"https://apps.apple.com/tw/app/minti-lets-be-present/id6791064385\" target=\"_blank\" rel=\"noopener\" aria-label=\"Download on the App Store\">\n            <svg viewBox=\"0 0 24 24\" fill=\"#fff\" aria-hidden=\"true\"><path d=\"M16.365 1.43c.05 1.02-.34 2.02-.99 2.74-.68.76-1.78 1.34-2.85 1.26-.09-1 .38-2.04.99-2.72.68-.75 1.86-1.32 2.85-1.28zM19.6 17.06c-.53 1.22-.78 1.76-1.46 2.84-.95 1.5-2.29 3.37-3.95 3.38-1.47.02-1.85-.96-3.85-.95-2 .01-2.42.97-3.9.95-1.66-.02-2.93-1.71-3.88-3.21-2.66-4.2-2.94-9.12-1.3-11.74 1.16-1.85 3-2.93 4.72-2.93 1.76 0 2.86.98 4.31.98 1.41 0 2.27-.98 4.3-.98 1.53 0 3.16.84 4.31 2.28-3.79 2.08-3.17 7.49.6 9.38z\"/><\/svg>\n            <span class=\"b-txt\"><span class=\"b-small\">Download on the<\/span><span class=\"b-big\">App Store<\/span><\/sp ort, don't leave\n      e.preventDefault();\n      parent.postMessage({ t: 'ext', href: href }, '*');\n      return;\n    }\n    var m = href.match(/^([\\w-]+)\\.html(#.*)?$/);\n    if (m) {\n      e.preventDefault();\n      parent.postMessage({ t: 'nav', page: m[1], hash: m[2] || '' }, '*');\n    }\n  });\n\n  parent.postMessage({ t: 'ready', title: document.title }, '*');\n})();\n<\/script>\n\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Company \u2014 Circle Five Studios<\/title>\n  <meta name=\"description\" content=\"The people around you become part of you \u2014 the story behind Circle Five Studios, the studio building minti.\" />\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin />\n  <link href=\"https://fonts.googleapis.com/css2?family=Caudex:wght@400;700&family=Nanum+Pen+Script&display=swap\" rel=\"stylesheet\" />\n  <style>\n/* ===== Circle Five / minti \u2014 shared styles for content pages =====\n   Palette and type follow the minti Design Library:\n   Caudex (never italic) for titles, the SF system stack for body copy,\n   Nanum Pen Script only for handwriting, always in the orange accent. */\n:root {\n  --bg: #FAF9F1;        /* m-paper  */\n  --ink: #114296;       /* m-ink / m-blue */\n  --ink-dark: #0B2F6E;  /* m-blue-dark \u2014 link hover */\n  --ink-light: #1B68E4; /* lighter blue \u2014 pressed state, 5.06:1 with white text */\n  --muted: #5A5F68;     /* m-ink-soft, darkened to 6.08:1 on --bg for body copy */\n  --faint: #686E79;     /* secondary metadata, 4.86:1 on --bg */\n  --line: rgba(17, 66, 150, 0.12);\n  --panel: #F0EFE4;     /* m-cream */\n  --panel-2: #E6E4D8;   /* m-desk  */\n  --sand: #F2E7D4;      /* m-sand  */\n  --accent: #F66E22;    /* m-orange */\n  --yellow: #F6B93B;    /* m-yellow */\n  --serif: 'Caudex', Georgia, 'Times New Roman', serif;\n  --hand: 'Nanum Pen Script', 'Segoe Script', cursive;\n  --sans: -apple-system, 'SF Pro Text', 'SF Pro Display', system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\nhtml { scroll-behavior: smooth; }\nbody {\n  font-family: var(--sans);\n  background: var(--bg);\n  color: var(--ink);\n  line-height: 1.55;\n  -webkit-font-smoothing: antialiased;\n  overflow-x: hidden;\n}\nh1, h2, h3, h4 { font-family: var(--serif); font-weight: 400; line-height: 1.1; letter-spacing: -0.01em; }\na { color: inherit; text-decoration: none; }\na:hover { color: var(--ink-dark); }\n\n.wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 28px; }\n.narrow { max-width: 720px; }\n.center { text-align: center; }\n.left { text-align: left; }\n\n/* ---------- Nav ---------- */\nheader.nav { position: sticky; top: 0; z-index: 50; background: rgba(250, 249, 241, 0.86); backdrop-filter: saturate(1.3) blur(10px); border-bottom: 1px solid var(--line); }\n.nav-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }\n.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 1.12rem; letter-spacing: -0.01em; }\n.brand .mark { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--ink); background: transparent; }\n/* minti wordmark logo (m : t) */\n.logo { display: inline-flex; align-items: center; font-family: var(--serif); font-weight: 700; font-size: 1.6rem; line-height: 1; letter-spacing: -0.01em; }\n.logo .lm, .logo .lt { color: var(--ink); }\n.logo .lc { display: inline-flex; flex-direction: column; justify-content: center; gap: 0.12em; margin: 0 0.11em; }\n.logo .lc i { width: 0.2em; height: 0.2em; border-radius: 50%; background: var(--accent); }\n.nav-links { display: flex; align-items: center; gap: 26px; font-size: 0.96rem; color: var(--muted); font-weight: 500; }\n.nav-links a:hover, .nav-links a.active { color: var(--ink); }\n.nav-links .pill { background: var(--ink); color: #fff; padding: 8px 18px; border-radius: 999px; font-weight: 600; }\n.nav-links .pill:hover { color: #fff; opacity: 0.88; }\n@media (max-width: 720px) { .nav-links .link { display: none; } }\n\n/* ---------- Store badges ---------- */\n.badges { display: flex; gap: 12px; flex-wrap: wrap; }\n.badges.center { justify-content: center; }\n.badge { display: inline-flex; align-items: center; gap: 10px; background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 14px; transition: transform .15s ease, opacity .15s ease; }\n/* the color:#fff here isn't decorative \u2014 without it, the global a:hover\n   rule (a type selector + pseudo-class, which outranks .badge's plain\n   class) would flip this text to --ink-dark on hover. */\n.badge:hover { color: #fff; transform: translateY(-2px); opacity: 0.9; }\n.badge:active { background: var(--ink-light); color: #fff; opacity: 1; }\n.badge svg { width: 24px; height: 24px; flex: none; }\n.badge .b-txt { text-align: left; line-height: 1.1; white-space: nowrap; }\n.badge .b-small { font-size: 0.62rem; letter-spacing: 0.03em; opacity: 0.85; display: block; }\n.badge .b-big { font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; }\n\n/* ---------- Sections ---------- */\nsection { padding: 82px 0; }\n.divider { height: 1px; background: var(--line); border: 0; }\n.eyebrow { font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 16px; }\nh1.page-title { font-size: clamp(2.6rem, 6vw, 4.6rem); line-height: 1.05; margin-bottom: 20px; }\nh1.page-title .it { color: var(--accent); }\nh2.h { font-size: clamp(2rem, 4.4vw, 3.1rem); margin-bottom: 18px; }\n.lead-p { font-size: 1.16rem; color: var(--muted); }\n.sub { font-size: 1.05rem; color: var(--muted); max-width: 54ch; margin-left: auto; margin-right: auto; }\n\n/* hero */\n.hero { padding: 90px 0 46px; text-align: center; }\n.hero .lead { font-size: clamp(1.1rem, 2.2vw, 1.4rem); color: var(--muted); max-width: 32ch; margin: 0 auto 14px; }\n.hero .badges { margin-top: 30px; }\n\n/* steps */\n.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; margin-top: 56px; text-align: left; }\n@media (max-width: 760px) { .steps { grid-template-columns: 1fr; gap: 36px; } }\n.steps-4 { grid-template-columns: repeat(4, 1fr); }\n@media (max-width: 980px) { .steps-4 { grid-template-columns: repeat(2, 1fr); } }\n@media (max-width: 560px) { .steps-4 { grid-template-columns: 1fr; } }\n.step .n { font-family: var(--serif); font-size: 2.4rem; color: var(--faint); margin-bottom: 10px; }\n.step h4 { font-size: 1.4rem; margin-bottom: 8px; }\n.step p { color: var(--muted); }\n\n/* murmur: the only handwriting on the site \u2014 always the orange accent,\n   and only at the library's two sizes (24px block, 18px inline). */\n.murmur { font-family: var(--hand); font-style: normal; color: var(--accent); font-size: 24px; line-height: 1.3; }\n.murmur-sm { font-size: 18px; }\np.murmur { margin: 26px 0 12px; }   /* block murmurs need the breathing room .statement had */\n\n/* chapter mark: a small brand glyph used as a section-break ornament */\n.chapter-mark { padding: 44px 0; }\n.chapter-mark .logo { font-size: 2.4rem; }\n\n/* stanza: tight-spaced stacked lines (poem-like pacing) */\n.stanza { display: flex; flex-direction: column; gap: 6px; margin: 20px 0; }\n.stanza p { margin: 0; color: var(--muted); font-size: 1.08rem; }\n\n/* stats row */\n.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; margin-top: 52px; text-align: left; }\n@media (max-width: 760px) { .stats { grid-template-columns: 1fr; gap: 36px; } }\n.stat-label { font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 12px; }\n.stat-num { font-family: var(--serif); font-size: clamp(2.6rem, 6vw, 3.6rem); color: var(--accent); line-height: 1; margin-bottom: 10px; }\n.stat-caption { color: var(--muted); }\n\n/* split */\n.split { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }\n.split.reverse .visual { order: 2; }\n@media (max-width: 820px) { .split { grid-template-columns: 1fr; gap: 40px; } .split.reverse .visual { order: 0; } }\n.split h3 { font-size: clamp(1.7rem, 3.4vw, 2.4rem); margin-bottom: 16px; }\n.split p { color: var(--muted); font-size: 1.08rem; margin-bottom: 14px; }\n.quote { font-family: var(--serif); font-size: 1.35rem; color: var(--ink); margin-top: 6px; }\n.panel-card { background: var(--panel); border-radius: 28px; padding: 40px; }\n\n/* narrative statement lines (short punch lines inside a text section) */\n.statement { font-family: var(--serif); font-size: 1.3rem; color: var(--ink); margin: 30px 0 12px; }\n.statement:first-of-type { margin-top: 0; }\n\n/* ---------- card grids (kominapp-style section rhythm) ---------- */\n.sec-intro { max-width: 640px; }\n.prose { max-width: 660px; }\n.sec-intro .lead-p { margin-top: 14px; }\n\n.cards { display: grid; gap: 20px; margin-top: 46px; align-items: stretch; }\n.cards-3 { grid-template-columns: repeat(3, 1fr); }\n.cards-4 { grid-template-columns: repeat(4, 1fr); }\n@media (max-width: 980px) { .cards-3, .cards-4 { grid-template-columns: repeat(2, 1fr); } }\n@media (max-width: 620px)  { .cards-3, .cards-4 { grid-template-columns: 1fr; } }\n\n.card {\n  display: flex;\n  flex-direction: column;\n  background: var(--panel);\n  border: 1px solid var(--line);\n  border-radius: 20px;\n  padding: 32px 28px;\n  text-align: left;\n}\n.card .eyebrow { margin-bottom: 14px; }\n.card h3 { font-size: 1.3rem; line-height: 1.2; margin-bottom: 12px; }\n.card p { color: var(--muted); }\n.card p + p { margin-top: 10px; }\n\n/* closing call to action, sat inside a card like kominapp's \u2014\n   the card is centred on the page and its contents centred within it. */\n.cta-card {\n  background: var(--panel);\n  border: 1px solid var(--line);\n  border-radius: 24px;\n  padding: clamp(36px, 6vw, 60px);\n  max-width: 760px;\n  margin: 0 auto;\n  text-align: center;\n}\n.cta-card h2 { font-size: clamp(1.9rem, 4vw, 2.8rem); margin-bottom: 14px; }\n.cta-card p { color: var(--muted); font-size: 1.1rem; max-width: 48ch; margin: 0 auto 28px; }\n.cta-card .badges { justify-content: center; }\n\n/* ---------- narrative carousel ---------- */\n.carousel { position: relative; }\n.carousel-track {\n  display: flex;\n  gap: 24px;\n  overflow-x: auto;\n  scroll-snap-type: x mandatory;\n  scroll-behavior: smooth;\n  padding: 6px max(28px, calc((100% - 620px) / 2)) 12px;\n  scrollbar-width: none;\n  -webkit-overflow-scrolling: touch;\n}\n.carousel-track::-webkit-scrollbar { display: none; }\n\n.carousel-card {\n  flex: 0 0 min(100%, 620px);\n  scroll-snap-align: center;\n  background: var(--panel);\n  border: 1px solid var(--line);\n  border-radius: 26px;\n  padding: 38px 34px 40px;\n  text-align: left;\n  transition: opacity .35s ease;\n}\n/* neighbours dim only once the script is driving the carousel */\n.carousel.is-ready .carousel-card { opacity: 0.5; }\n.carousel.is-ready .carousel-card.is-active { opacity: 1; }\n\n.carousel-card > * { margin: 0; }\n.carousel-card .eyebrow { margin-bottom: 12px; }\n.carousel-card h3 { font-size: clamp(1.5rem, 3vw, 2rem); margin-bottom: 20px; }\n.carousel-card .statement { font-size: 1.18rem; margin: 20px 0 8px; }\n.carousel-card h3 + .statement { margin-top: 0; }\n.carousel-card .lead-p { font-size: 1.04rem; }\n.carousel-card .lead-p + .lead-p { margin-top: 12px; }\n\n.carousel-controls { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 10px; }\n.carousel-btn {\n  width: 42px; height: 42px; padding: 0;\n  border: 1px solid var(--line); border-radius: 50%;\n  background: var(--bg); color: var(--ink);\n  display: grid; place-items: center; cursor: pointer;\n  transition: border-color .15s ease, opacity .15s ease;\n}\n.carousel-btn:hover:not(:disabled) { border-color: var(--ink); }\n.carousel-btn:disabled { opacity: 0.3; cursor: default; }\n.carousel-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n\n.carousel-dots { display: flex; align-items: center; gap: 9px; }\n.carousel-dot {\n  width: 8px; height: 8px; padding: 0;\n  border: 0; border-radius: 50%;\n  background: #d4d2ce; cursor: pointer;\n  transition: background-color .2s ease, transform .2s ease;\n}\n.carousel-dot[aria-current=\"true\"] { background: var(--accent); transform: scale(1.3); }\n.carousel-dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }\n\n@media (prefers-reduced-motion: reduce) {\n  .carousel-track { scroll-behavior: auto; }\n  .carousel-card, .carousel-dot, .carousel-btn { transition: none; }\n}\n\n/* step micro-label under the numeral */\n/* Deliberately inherits --muted from `.step p`: the accent orange only reaches\n   2.77:1 on --bg, too low for label-size text. */\n.step-label { font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; margin-bottom: 10px; }\n\n/* simple benefit list */\n.mini-list { list-style: none; margin: 24px auto; display: flex; flex-direction: column; gap: 10px; max-width: 46ch; }\n.mini-list li { color: var(--muted); font-size: 1.08rem; padding-left: 22px; position: relative; text-align: left; }\n.mini-list li::before { content: \"\u2014\"; position: absolute; left: 0; color: var(--accent); }\n\n/* jar */\n.jar { position: relative; width: 190px; height: 224px; margin: 0 auto; }\n.jar-lid { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 116px; height: 28px; background: var(--ink); border-radius: 9px; }\n.jar-body { position: absolute; bottom: 0; width: 100%; height: 186px; border: 3px solid var(--ink); border-radius: 18px 18px 30px 30px; overflow: hidden; }\n.candies { position: absolute; bottom: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap-reverse; gap: 6px; justify-content: center; }\n.candy { width: 30px; height: 30px; border-radius: 50%; box-shadow: inset -3px -3px 0 rgba(0,0,0,0.08); }\n\n/* leaderboard */\n.lb { display: flex; flex-direction: column; gap: 18px; }\n.lb-row { display: flex; align-items: center; gap: 14px; }\n.lb-av { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; }\n.lb-bar { flex: 1; }\n.lb-bar .track { height: 8px; background: var(--panel-2); border-radius: 9px; margin-top: 6px; }\n.lb-bar .fill { height: 100%; background: var(--ink); border-radius: 9px; }\n.lb-h { font-weight: 700; color: var(--ink); }\n\n/* tags */\n.tags { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 34px; }\n.tag { border: 1px solid var(--line); border-radius: 999px; padding: 11px 22px; font-weight: 500; }\n\n/* products */\n.products { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 52px; text-align: left; }\n@media (max-width: 760px) { .products { grid-template-columns: 1fr; } }\n.product { border: 1px solid var(--line); border-radius: 24px; padding: 34px; transition: border-color .15s ease, transform .15s ease; display: block; }\n.product:hover { border-color: var(--ink); transform: translateY(-3px); }\n.product .p-ic { width: 46px; height: 46px; border-radius: 13px; background: var(--panel); display: grid; place-items: center; font-size: 1.4rem; margin-bottom: 18px; }\n.product h3 { font-size: 1.55rem; margin-bottom: 6px; }\n.product .role { font-size: 0.82rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); font-weight: 600; margin-bottom: 14px; }\n.product p { color: var(--muted); }\n.product .more { display: inline-block; margin-top: 16px; font-weight: 600; color: var(--ink); }\n.product .more::after { content: \" \u2192\"; }\n\n/* value list */\n.values { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 52px; text-align: left; }\n@media (max-width: 760px) { .values { grid-template-columns: 1fr; gap: 28px; } }\n.values-4 { grid-template-columns: repeat(4, 1fr); }\n@media (max-width: 980px) { .values-4 { grid-template-columns: repeat(2, 1fr); } }\n@media (max-width: 560px) { .values-4 { grid-template-columns: 1fr; } }\n.value h4 { font-size: 1.3rem; margin-bottom: 8px; }\n.value p { color: var(--muted); }\n.value .stanza { margin: 0 0 10px; }\n.value .stanza p { font-size: 1rem; }\n\n/* cta */\n.cta { text-align: center; }\n.cta h2 { font-size: clamp(2.2rem, 5vw, 3.6rem); margin-bottom: 16px; }\n.cta p { color: var(--muted); max-width: 46ch; margin: 0 auto 30px; font-size: 1.12rem; }\n\n/* letter (postkitty) */\n.letter { background: var(--panel); border-radius: 20px; padding: 34px 30px; box-shadow: 0 30px 60px -40px rgba(0,0,0,0.35); position: relative; max-width: 380px; margin: 0 auto; transform: rotate(-2deg); }\n.letter .stamp { position: absolute; top: 18px; right: 18px; width: 54px; height: 64px; border-radius: 6px; background: repeating-linear-gradient(45deg, var(--accent), var(--accent) 6px, #f07a5e 6px, #f07a5e 12px); box-shadow: 0 0 0 4px #fff, 0 0 0 6px var(--panel-2); }\n.letter .lines { margin-top: 40px; display: flex; flex-direction: column; gap: 12px; }\n.letter .lines span { height: 8px; background: #dfdedb; border-radius: 6px; }\n.letter .lines span:nth-child(1) { width: 60%; }\n.letter .lines span:nth-child(2) { width: 90%; }\n.letter .lines span:nth-child(3) { width: 80%; }\n.letter .lines span:nth-child(4) { width: 40%; }\n.letter .sign { margin-top: 22px; font-family: var(--hand); color: var(--accent); font-size: 1.5rem; }\n\n/* app screenshot */\n.shot { width: 100%; max-width: 380px; border-radius: 26px; box-shadow: 0 34px 70px -38px rgba(0,0,0,0.45); display: block; margin: 0 auto; }\n\n/* legal pages (terms / privacy) */\n.legal { max-width: 760px; margin: 0 auto; padding: clamp(48px, 8vh, 80px) 28px clamp(56px, 9vh, 96px); }\n.legal h1 { font-size: clamp(2.2rem, 5vw, 3.2rem); margin-bottom: 8px; }\n.legal .updated { color: var(--faint); font-size: 0.9rem; margin-bottom: 34px; }\n.legal h2 { font-size: 1.4rem; margin-top: 42px; margin-bottom: 12px; }\n.legal p { color: var(--muted); margin-bottom: 14px; line-height: 1.75; }\n.legal ul { color: var(--muted); margin: 0 0 18px 1.2em; line-height: 1.75; }\n.legal li { margin-bottom: 6px; }\n.legal a { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }\n.legal strong { color: var(--ink); font-weight: 700; }\n\n/* homepage-style corner footer (used on content pages too) */\nfooter.corner { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 40px clamp(20px, 4vw, 44px); border-top: 1px solid var(--line); }\nfooter.corner .foot-left { display: flex; flex-direction: column; gap: 4px; font-size: 0.82rem; color: var(--faint); line-height: 1.4; justify-self: start; }\nfooter.corner .foot-left a { color: var(--muted); }\nfooter.corner .foot-left a:hover { color: var(--ink); }\nfooter.corner .foot-center { display: flex; gap: 26px; justify-self: center; font-size: 0.92rem; font-weight: 500; color: var(--muted); }\nfooter.corner .foot-center a:hover { color: var(--ink); }\nfooter.corner .badges { justify-self: end; }\n@media (max-width: 720px) {\n  footer.corner { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 16px; }\n  footer.corner .foot-left { align-items: center; }\n  footer.corner .foot-center { order: -1; flex-wrap: wrap; justify-content: center; gap: 18px; }\n}\n\n/* footer */\nfooter.site { border-top: 1px solid var(--line); padding: 62px 0 40px; }\n.foot-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 30px; }\n@media (max-width: 720px) { .foot-grid { grid-template-columns: 1fr 1fr; gap: 34px; } }\n.foot-brand p { color: var(--muted); margin-top: 12px; font-size: 0.92rem; max-width: 32ch; }\n.foot-col h5 { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin-bottom: 14px; font-weight: 700; font-family: var(--sans); }\n.foot-col a { display: block; margin-bottom: 10px; color: var(--muted); font-size: 0.96rem; }\n.foot-col a:hover { color: var(--ink); }\n.foot-bottom { margin-top: 50px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; color: var(--faint); font-size: 0.86rem; }\n\n/* reveal */\n.reveal { opacity: 0; transform: translateY(20px); transition: opacity .7s ease, transform .7s ease; }\n.reveal.in { opacity: 1; transform: none; }\n@media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } html { scroll-behavior: auto; } }\n\n<\/style>\n<\/head>\n<body>\n\n  <header class=\"nav\">\n    <div class=\"wrap nav-inner\">\n      <a class=\"brand\" href=\"index.html\" aria-label=\"minti home\"><span class=\"logo\" aria-hidden=\"true\"><span class=\"lm\">m<\/span><span class=\"lc\"><i><\/i><i><\/i><\/span><span class=\"lt\">t<\/span><\/span><\/a>\n      <nav class=\"nav-links\">\n        <a class=\"link\" href=\"index.html\">minti<\/a>\n        <a class=\"link\" href=\"about.html\">about<\/a>\n        <a class=\"link active\" href=\"company.html\">company<\/a>\n        <a class=\"pill\" href=\"https://apps.apple.com/tw/app/minti-lets-be-present/id6791064385\" target=\"_blank\" rel=\"noopener\">Get the app<\/a>\n      <\/nav>\n    <\/div>\n  <\/header>\n\n  <!-- HERO -->\n  <section class=\"hero\">\n    <div class=\"wrap narrow\">\n      <h1 class=\"page-title\">the people around you become part of you.<\/h1>\n      <p class=\"lead-p\">your friends shape your life.<\/p>\n    <\/div>\n  <\/section>\n\n  <hr class=\"divider\" />\n\n  <!-- HERO, CONTINUED -->\n  <section>\n    <div class=\"wrap narrow center reveal\">\n      <div class=\"stanza\">\n        <p>the one who taught you to laugh at yourself.<\/p>\n        <p>the roommate who saw everything.<\/p>\n        <p>the person you can call at 2am.<\/p>\n      <\/div>\n      <p class=\"statement\">we build things that help you keep those people close.<\/p>\n    <\/div>\n      return;\n    }\n    var m = href.match(/^([\\w-]+)\\.html(#.*)?$/);\n    if (m) {\n      e.preventDefault();\n      parent.postMessage({ t: 'nav', page: m[1], hash: m[2] || '' }, '*');\n    }\n  });\n\n  parent.postMessage({ t: 'ready', title: document.title }, '*');\n})();\n<\/script>\n\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Privacy Policy \u2014 minti<\/title>\n  <meta name=\"description\" content=\"Privacy Policy for the minti app by Circle Five Studios.\" />\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin />\n  <link href=\"https://fonts.googleapis.com/css2?family=Caudex:wght@400;700&family=Nanum+Pen+Script&display=swap\" rel=\"stylesheet\" />\n  <style>\n/* ===== Circle Five / minti \u2014 shared styles for content pages =====\n   Palette and type follow the minti Design Library:\n   Caudex (never italic) for titles, the SF system stack for body copy,\n   Nanum Pen Script only for handwriting, always in the orange accent. */\n:root {\n  --bg: #FAF9F1;        /* m-paper  */\n  --ink: #114296;       /* m-ink / m-blue */\n  --ink-dark: #0B2F6E;  /* m-blue-dark \u2014 link hover */\n  --ink-light: #1B68E4; /* lighter blue \u2014 pressed state, 5.06:1 with white text */\n  --muted: #5A5F68;     /* m-ink-soft, darkened to 6.08:1 on --bg for body copy */\n  --faint: #686E79;     /* secondary metadata, 4.86:1 on --bg */\n  --line: rgba(17, 66, 150, 0.12);\n  --panel: #F0EFE4;     /* m-cream */\n  --panel-2: #E6E4D8;   /* m-desk  */\n  --sand: #F2E7D4;      /* m-sand  */\n  --accent: #F66E22;    /* m-orange */\n  --yellow: #F6B93B;    /* m-yellow */\n  --serif: 'Caudex', Georgia, 'Times New Roman', serif;\n  --hand: 'Nanum Pen Script', 'Segoe Script', cursive;\n  --sans: -apple-system, 'SF Pro Text', 'SF Pro Display', system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\nhtml { scroll-behavior: smooth; }\nbody {\n  font-family: var(--sans);\n  background: var(--bg);\n  color: var(--ink);\n  line-height: 1.55;\n  -webkit-font-smoothing: antialiased;\n  overflow-x: hidden;\n}\nh1, h2, h3, h4 { font-family: var(--serif); font-weight: 400; line-height: 1.1; letter-spacing: -0.01em; }\na { color: inherit; text-decoration: none; }\na:hover { color: var(--ink-dark); }\n\n.wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 28px; }\n.narrow { max-width: 720px; }\n.center { text-align: center; }\n.left { text-align: left; }\n\n/* ---------- Nav ---------- */\nheader.nav { position: sticky; top: 0; z-index: 50; background: rgba(250, 249, 241, 0.86); backdrop-filter: saturate(1.3) blur(10px); border-bottom: 1px solid var(--line); }\n.nav-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }\n.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 1.12rem; letter-spacing: -0.01em; }\n.brand .mark { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--ink); background: transparent; }\n/* minti wordmark logo (m : t) */\n.logo { display: inline-flex; align-items: center; font-family: var(--serif); font-weight: 700; font-size: 1.6rem; line-height: 1; letter-spacing: -0.01em; }\n.logo .lm, .logo .lt { color: var(--ink); }\n.logo .lc { display: inline-flex; flex-direction: column; justify-content: center; gap: 0.12em; margin: 0 0.11em; }\n.logo .lc i { width: 0.2em; height: 0.2em; border-radius: 50%; background: var(--accent); }\n.nav-links { display: flex; align-items: center; gap: 26px; font-size: 0.96rem; color: var(--muted); font-weight: 500; }\n.nav-links a:hover, .nav-links a.active { color: var(--ink); }\n.nav-links .pill { background: var(--ink); color: #fff; padding: 8px 18px; border-radius: 999px; font-weight: 600; }\n.nav-links .pill:hover { color: #fff; opacity: 0.88; }\n@media (max-width: 720px) { .nav-links .link { display: none; } }\n\n/* ---------- Store badges ---------- */\n.badges { display: flex; gap: 12px; flex-wrap: wrap; }\n.badges.center { justify-content: center; }\n.badge { display: inline-flex; align-items: center; gap: 10px; background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 14px; transition: transform .15s ease, opacity .15s ease; }\n/* the color:#fff here isn't decorative \u2014 without it, the global a:hover\n   rule (a type selector + pseudo-class, which outranks .badge's plain\n   class) would flip this text to --ink-dark on hover. */\n.badge:hover { color: #fff; transform: translateY(-2px); opacity: 0.9; }\n.badge:active { background: var(--ink-light); color: #fff; opacity: 1; }\n.badge svg { width: 24px; height: 24px; flex: none; }\n.badge .b-txt { text-align: left; line-height: 1.1; white-space: nowrap; }\n.badge .b-small { font-size: 0.62rem; letter-spacing: 0.03em; opacity: 0.85; display: block; }\n.badge .b-big { font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; }\n\n/* ---------- Sections ---------- */\nsection { padding: 82px 0; }\n.divider { height: 1px; background: var(--line); border: 0; }\n.eyebrow { font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 16px; }\nh1.page-title { font-size: clamp(2.6rem, 6vw, 4.6rem); line-height: 1.05; margin-bottom: 20px; }\nh1.page-title .it { color: var(--accent); }\nh2.h { font-size: clamp(2rem, 4.4vw, 3.1rem); margin-bottom: 18px; }\n.lead-p { font-size: 1.16rem; color: var(--muted); }\n.sub { font-size: 1.05rem; color: var(--muted); max-width: 54ch; margin-left: auto; margin-right: auto; }\n\n/* hero */\n.hero { padding: 90px 0 46px; text-align: center; }\n.hero .lead { font-size: clamp(1.1rem, 2.2vw, 1.4rem); color: var(--muted); max-width: 32ch; margin: 0 auto 14px; }\n.hero .badges { margin-top: 30px; }\n\n/* steps */\n.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; margin-top: 56px; text-align: left; }\n@media (max-width: 760px) { .steps { grid-template-columns: 1fr; gap: 36px; } }\n.steps-4 { grid-template-columns: repeat(4, 1fr); }\n@media (max-width: 980px) { .steps-4 { grid-template-columns: repeat(2, 1fr); } }\n@media (max-width: 560px) { .steps-4 { grid-template-columns: 1fr; } }\n.step .n { font-family: var(--serif); font-size: 2.4rem; color: var(--faint); margin-bottom: 10px; }\n.step h4 { font-size: 1.4rem; margin-bottom: 8px; }\n.step p { color: var(--muted); }\n\n/* murmur: the only handwriting on the site \u2014 always the orange accent,\n   and only at the library's two sizes (24px block, 18px inline). */\n.murmur { font-family: var(--hand); font-style: normal; color: var(--accent); font-size: 24px; line-height: 1.3; }\n.murmur-sm { font-size: 18px; }\np.murmur { margin: 26px 0 12px; }   /* block murmurs need the breathing room .statement had */\n\n/* chapter mark: a small brand glyph used as a section-break ornament */\n.chapter-mark { padding: 44px 0; }\n.chapter-mark .logo { font-size: 2.4rem; }\n\n/* stanza: tight-spaced stacked lines (poem-like pacing) */\n.stanza { display: flex; flex-direction: column; gap: 6px; margin: 20px 0; }\n.stanza p { margin: 0; color: var(--muted); font-size: 1.08rem; }\n\n/* stats row */\n.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; margin-top: 52px; text-align: left; }\n@media (max-width: 760px) { .stats { grid-template-columns: 1fr; gap: 36px; } }\n.stat-label { font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 12px; }\n.stat-num { font-family: var(--serif); font-size: clamp(2.6rem, 6vw, 3.6rem); color: var(--accent); line-height: 1; margin-bottom: 10px; }\n.stat-caption { color: var(--muted); }\n\n/* split */\n.split { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }\n.split.reverse .visual { order: 2; }\n@media (max-width: 820px) { .split { grid-template-columns: 1fr; gap: 40px; } .split.reverse .visual { order: 0; } }\n.split h3 { font-size: clamp(1.7rem, 3.4vw, 2.4rem); margin-bottom: 16px; }\n.split p { color: var(--muted); font-size: 1.08rem; margin-bottom: 14px; }\n.quote { font-family: var(--serif); font-size: 1.35rem; color: var(--ink); margin-top: 6px; }\n.panel-card { background: var(--panel); border-radius: 28px; padding: 40px; }\n\n/* narrative statement lines (short punch lines inside a text section) */\n.statement { font-family: var(--serif); font-size: 1.3rem; color: var(--ink); margin: 30px 0 12px; }\n.statement:first-of-type { margin-top: 0; }\n\n/* ---------- card grids (kominapp-style section rhythm) ---------- */\n.sec-intro { max-width: 640px; }\n.prose { max-width: 660px; }\n.sec-intro .lead-p { margin-top: 14px; }\n\n.cards { display: grid; gap: 20px; margin-top: 46px; align-items: stretch; }\n.cards-3 { grid-template-columns: repeat(3, 1fr); }\n.cards-4 { grid-template-columns: repeat(4, 1fr); }\n@media (max-width: 980px) { .cards-3, .cards-4 { grid-template-columns: repeat(2, 1fr); } }\n@media (max-width: 620px)  { .cards-3, .cards-4 { grid-template-columns: 1fr; } }\n\n.card {\n  display: flex;\n  flex-direction: column;\n  background: var(--panel);\n  border: 1px solid var(--line);\n  border-radius: 20px;\n  padding: 32px 28px;\n  text-align: left;\n}\n.card .eyebrow { margin-bottom: 14px; }\n.card h3 { font-size: 1.3rem; line-height: 1.2; margin-bottom: 12px; }\n.card p { color: var(--muted); }\n.card p + p { margin-top: 10px; }\n\n/* closing call to action, sat inside a card like kominapp's \u2014\n   the card is centred on the page and its contents centred within it. */\n.cta-card {\n  background: var(--panel);\n  border: 1px solid var(--line);\n  border-radius: 24px;\n  padding: clamp(36px, 6vw, 60px);\n  max-width: 760px;\n  margin: 0 auto;\n  text-align: center;\n}\n.cta-card h2 { font-size: clamp(1.9rem, 4vw, 2.8rem); margin-bottom: 14px; }\n.cta-card p { color: var(--muted); font-size: 1.1rem; max-width: 48ch; margin: 0 auto 28px; }\n.cta-card .badges { justify-content: center; }\n\n/* ---------- narrative carousel ---------- */\n.carousel { position: relative; }\n.carousel-track {\n  display: flex;\n  gap: 24px;\n  overflow-x: auto;\n  scroll-snap-type: x mandatory;\n  scroll-behavior: smooth;\n  padding: 6px max(28px, calc((100% - 620px) / 2)) 12px;\n  scrollbar-width: none;\n  -webkit-overflow-scrolling: touch;\n}\n.carousel-track::-webkit-scrollbar { display: none; }\n\n.carousel-card {\n  flex: 0 0 min(100%, 620px);\n  scroll-snap-align: center;\n  background: var(--panel);\n  border: 1px solid var(--line);\n  border-radius: 26px;\n  padding: 38px 34px 40px;\n  text-align: left;\n  transition: opacity .35s ease;\n}\n/* neighbours dim only once the script is driving the carousel */\n.carousel.is-ready .carousel-card { opacity: 0.5; }\n.carousel.is-ready .carousel-card.is-active { opacity: 1; }\n\n.carousel-card > * { margin: 0; }\n.carousel-card .eyebrow { margin-bottom: 12px; }\n.carousel-card h3 { font-size: clamp(1.5rem, 3vw, 2rem); margin-bottom: 20px; }\n.carousel-card .statement { font-size: 1.18rem; margin: 20px 0 8px; }\n.carousel-card h3 + .statement { margin-top: 0; }\n.carousel-card .lead-p { font-size: 1.04rem; }\n.carousel-card .lead-p + .lead-p { margin-top: 12px; }\n\n.carousel-controls { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 10px; }\n.carousel-btn {\n  width: 42px; height: 42px; padding: 0;\n  border: 1px solid var(--line); border-radius: 50%;\n  background: var(--bg); color: var(--ink);\n  display: grid; place-items: center; cursor: pointer;\n  transition: border-color .15s ease, opacity .15s ease;\n}\n.carousel-btn:hover:not(:disabled) { border-color: var(--ink); }\n.carousel-btn:disabled { opacity: 0.3; cursor: default; }\n.carousel-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n\n.carousel-dots { display: flex; align-items: center; gap: 9px; }\n.carousel-dot {\n  width: 8px; height: 8px; padding: 0;\n  border: 0; border-radius: 50%;\n  background: #d4d2ce; cursor: pointer;\n  transition: background-color .2s ease, transform .2s ease;\n}\n.carousel-dot[aria-current=\"true\"] { background: var(--accent); transform: scale(1.3); }\n.carousel-dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }\n\n@media (prefers-reduced-motion: reduce) {\n  .carousel-track { scroll-behavior: auto; }\n  .carousel-card, .carousel-dot, .carousel-btn { transition: none; }\n}\n\n/* step micro-label under the numeral */\n/* Deliberately inherits --muted from `.step p`: the accent orange only reaches\n   2.77:1 on --bg, too low for label-size text. */\n.step-label { font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; margin-bottom: 10px; }\n\n/* simple benefit list */\n.mini-list { list-style: none; margin: 24px auto; display: flex; flex-direction: column; gap: 10px; max-width: 46ch; }\n.mini-list li { color: var(--muted); font-size: 1.08rem; padding-left: 22px; position: relative; text-align: left; }\n.mini-list li::before { content: \"\u2014\"; position: absolute; left: 0; color: var(--accent); }\n\n/* jar */\n.jar { position: relative; width: 190px; height: 224px; margin: 0 auto; }\n.jar-lid { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 116px; height: 28px; background: var(--ink); border-radius: 9px; }\n.jar-body { position: absolute; bottom: 0; width: 100%; height: 186px; border: 3px solid var(--ink); border-radius: 18px 18px 30px 30px; overflow: hidden; }\n.candies { position: absolute; bottom: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap-reverse; gap: 6px; justify-content: center; }\n.candy { width: 30px; height: 30px; border-radius: 50%; box-shadow: inset -3px -3px 0 rgba(0,0,0,0.08); }\n\n/* leaderboard */\n.lb { display: flex; flex-direction: column; gap: 18px; }\n.lb-row { display: flex; align-items: center; gap: 14px; }\n.lb-av { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; }\n.lb-bar { flex: 1; }\n.lb-bar .track { height: 8px; background: var(--panel-2); border-radius: 9px; margin-top: 6px; }\n.lb-bar .fill { height: 100%; background: var(--ink); border-radius: 9px; }\n.lb-h { font-weight: 700; color: var(--ink); }\n\n/* tags */\n.tags { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 34px; }\n.tag { border: 1px solid var(--line); border-radius: 999px; padding: 11px 22px; font-weight: 500; }\n\n/* products */\n.products { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 52px; text-align: left; }\n@media (max-width: 760px) { .products { grid-template-columns: 1fr; } }\n.product { border: 1px solid var(--line); border-radius: 24px; padding: 34px; transition: border-color .15s ease, transform .15s ease; display: block; }\n.product:hover { border-color: var(--ink); transform: translateY(-3px); }\n.product .p-ic { width: 46px; height: 46px; border-radius: 13px; background: var(--panel); display: grid; place-items: center; font-size: 1.4rem; margin-bottom: 18px; }\n.product h3 { font-size: 1.55rem; margin-bottom: 6px; }\n.product .role { font-size: 0.82rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); font-weight: 600; margin-bottom: 14px; }\n.product p { color: var(--muted); }\n.product .more { display: inline-block; margin-top: 16px; font-weight: 600; color: var(--ink); }\n.product .more::after { content: \" \u2192\"; }\n\n/* value list */\n.values { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 52px; text-align: left; }\n@media (max-width: 760px) { .values { grid-template-columns: 1fr; gap: 28px; } }\n.values-4 { grid-template-columns: repeat(4, 1fr); }\n@media (max-width: 980px) { .values-4 { grid-template-columns: repeat(2, 1fr); } }\n@media (max-width: 560px) { .values-4 { grid-template-columns: 1fr; } }\n.value h4 { font-size: 1.3rem; margin-bottom: 8px; }\n.value p { color: var(--muted); }\n.value .stanza { margin: 0 0 10px; }\n.value .stanza p { font-size: 1rem; }\n\n/* cta */\n.cta { text-align: center; }\n.cta h2 { font-size: clamp(2.2rem, 5vw, 3.6rem); margin-bottom: 16px; }\n.cta p { color: var(--muted); max-width: 46ch; margin: 0 auto 30px; font-size: 1.12rem; }\n\n/* letter (postkitty) */\n.letter { background: var(--panel); border-radius: 20px; padding: 34px 30px; box-shadow: 0 30px 60px -40px rgba(0,0,0,0.35); position: relative; max-width: 380px; margin: 0 auto; transform: rotate(-2deg); }\n.letter .stamp { position: absolute; top: 18px; right: 18px; width: 54px; height: 64px; border-radius: 6px; background: repeating-linear-gradient(45deg, var(--accent), var(--accent) 6px, #f07a5e 6px, #f07a5e 12px); box-shadow: 0 0 0 4px #fff, 0 0 0 6px var(--panel-2); }\n.letter .lines { margin-top: 40px; display: flex; flex-direction: column; gap: 12px; }\n.letter .lines span { height: 8px; background: #dfdedb; border-radius: 6px; }\n.letter .lines span:nth-child(1) { width: 60%; }\n.letter .lines span:nth-child(2) { width: 90%; }\n.letter .lines span:nth-child(3) { width: 80%; }\n.letter .lines span:nth-child(4) { width: 40%; }\n.letter .sign { margin-top: 22px; font-family: var(--hand); color: var(--accent); font-size: 1.5rem; }\n\n/* app screenshot */\n.shot { width: 100%; max-width: 380px; border-radius: 26px; box-shadow: 0 34px 70px -38px rgba(0,0,0,0.45); display: block; margin: 0 auto; }\n\n/* legal pages (terms / privacy) */\n.legal { max-width: 760px; margin: 0 auto; padding: clamp(48px, 8vh, 80px) 28px clamp(56px, 9vh, 96px); }\n.legal h1 { font-size: clamp(2.2rem, 5vw, 3.2rem); margin-bottom: 8px; }\n.legal .updated { color: var(--faint); font-size: 0.9rem; margin-bottom: 34px; }\n.legal h2 { font-size: 1.4rem; margin-top: 42px; margin-bottom: 12px; }\n.legal p { color: var(--muted); margin-bottom: 14px; line-height: 1.75; }\n.legal ul { color: var(--muted); margin: 0 0 18px 1.2em; line-height: 1.75; }\n.legal li { margin-bottom: 6px; }\n.legal a { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }\n.legal strong { color: var(--ink); font-weight: 700; }\n\n/* homepage-style corner footer (used on content pages too) */\nfooter.corner { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 40px clamp(20px, 4vw, 44px); border-top: 1px solid var(--line); }\nfooter.corner .foot-left { display: flex; flex-direction: column; gap: 4px; font-size: 0.82rem; color: var(--faint); line-height: 1.4; justify-self: start; }\nfooter.corner .foot-left a { color: var(--muted); }\nfooter.corner .foot-left a:hover { color: var(--ink); }\nfooter.corner .foot-center { display: flex; gap: 26px; justify-self: center; font-size: 0.92rem; font-weight: 500; color: var(--muted); }\nfooter.corner .foot-center a:hover { color: var(--ink); }\nfooter.corner .badges { justify-self: end; }\n@media (max-width: 720px) {\n  footer.corner { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 16px; }\n  footer.corner .foot-left { align-items: center; }\n  footer.corner .foot-center { order: -1; flex-wrap: wrap; justify-content: center; gap: 18px; }\n}\n\n/* footer */\nfooter.site { border-top: 1px solid var(--line); padding: 62px 0 40px; }\n.foot-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 30px; }\n@media (max-width: 720px) { .foot-grid { grid-template-columns: 1fr 1fr; gap: 34px; } }\n.foot-brand p { color: var(--muted); margin-top: 12px; font-size: 0.92rem; max-width: 32ch; }\n.foot-col h5 { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin-bottom: 14px; font-weight: 700; font-family: var(--sans); }\n.foot-col a { display: block; margin-bottom: 10px; color: var(--muted); font-size: 0.96rem; }\n.foot-col a:hover { color: var(--ink); }\n.foot-bottom { margin-top: 50px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; color: var(--faint); font-size: 0.86rem; }\n\n/* reveal */\n.reveal { opacity: 0; transform: translateY(20px); transition: opacity .7s ease, transform .7s ease; }\n.reveal.in { opacity: 1; transform: none; }\n@media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } html { scroll-behavior: auto; } }\n\n<\/style>\n<\/head>\n<body>\n\n  <header class=\"nav\">\n    <div class=\"wrap nav-inner\">\n      <a class=\"brand\" href=\"index.html\" aria-label=\"minti home\"><span class=\"logo\" aria-hidden=\"true\"><span class=\"lm\">m<\/span><span class=\"lc\"><i><\/i><i><\/i><\/span><span class=\"lt\">t<\/span><\/span><\/a>\n      <nav class=\"nav-links\">\n        <a class=\"link\" href=\"index.html\">minti<\/a>\n        <a class=\"link\" href=\"about.html\">about<\/a>\n        <a class=\"link\" href=\"company.html\">company<\/a>\n        <a class=\"pill\" href=\"https://apps.apple.com/tw/app/minti-lets-be-present/id6791064385\" target=\"_blank\" rel=\"noopener\">Get the app<\/a>\n      <\/nav>\n    <\/div>\n  <\/header>\n\n  <main class=\"legal\">\n    <h1>Privacy Policy<\/h1>\n    <p class=\"updated\">Effective as of 2026-07-09<\/p>\n\n    <p>This privacy policy applies to the Minti app for mobile devices and web browsers, together with any related services operated by Wen-Chien, Wu (collectively, the \"Application\"). Wen-Chien, Wu is hereby referred to as the \"Service Provider\".<\/p>\n\n    <h2>Information Collection and Use<\/h2>\n    <p>The Application collects information when you download and use it. This information may include information such as<\/p>\n    <ul>\n      <li>Your device's Internet Protocol address<\/li>\n      <li>The pages of the Application that you visit, the time and date of your visit, the time spent on those pages<\/li>\n      <li>The time spent on the Application<\/li>\n      <li>your operating system you use<\/li>\n    <\/ul>\n d notices, and, where permitted by law, marketing communications.<\/p>\n    <p>For a better experience while using the Application, the Service Provider may require you to provide certain personally identifiable information, including but not limited to Email, userid. The information the Service Provider requests will be retained and used as described in this privacy policy.<\/p>\n\n    <h2>Third Party Access<\/h2>\n    <p>Only aggregated, anonymized data is periodically transmitted to external services to aid the Service Provider in improving the Application and their service. The Service Provider may share your information with third parties in the ways that are described in this privacy statement.<\/p>\n\n    <h2>International Data Transfers<\/h2>\n    <p>The Service Provider or its third-party service providers may transfer personal data to countries outside your country of residence, including outside the European Economic Area (EEA). Where applicable law requires safeguards for international transfers, the Service Provider will use appropriate mechanisms.<\/p>\n    <ul>\n      <li>Standard Contractual Clauses (SCCs) approved by the European Commission<\/li>\n      <li>Adequacy decisions or other legally recognized transfer mechanisms<\/li>\n      <li>Your consent, where required and legally permitted<\/li>\n    <\/ul>\n    <p>Data protection laws in other countries may differ from those in your jurisdiction. Where required by law, the Service Provider will apply appropriate safeguards and obtain any consent required for the transfer.<\/p>\n    <p>Please note that the Application utilizes third-party services that have their own Privacy Policy about handling data. Below are the links to the Privacy Policy of the third-party service providers used by the Application:<\/p>\n    <ul>\n      <li>Google Analytics for Firebase<\/li>\n      <li>Firebase Crashlytics<\/li>\n    <\/ul>\n    <p>The Service Provider may disclose User Provided and Automatically Collected Information:<\/p>\n    <ul>\n      <li>as required by law, such as to comply with a subpoena, or similar legal process;<\/li>\n      <li>when they believe in good faith that disclosure is necessary to protect their rights, protect your safety or the safety of others, investigate fraud, or respond to a government request;<\/li>\n      <li>with their trusted services providers who work on their behalf, do not have an independent use of the information the Service Provider discloses to them, and have agreed to adhere to the rules set forth in this privacy statement.<\/li>\n    <\/ul>\n\n    <h2>Opt-Out Rights<\/h2>\n    <p>You can stop further collection of information from your mobile device or computer by uninstalling the Application. Uninstalling will stop the Application from collecting data from your device, but it does not automatically delete information that has already been transmitted to the Service Provider or to third parties.<\/p>\n    <p>You can stop further collection of information from your device by ceasing to use the website. Ceasing to use will stop the website from collecting data from your device, but it does not automatically delete information that has already been transmitted to the Service Provider or to third parties.<\/p>\n    <p>To request deletion of your personal data, to withdraw consent, or to exercise any of your rights, contact the Service Provider at <a href=\"mailto:service@circlefive.co\">service@circlefive.co<\/a>.<\/p>\n\n    <h2>Data Retention Policy<\/h2>\n    <p>The Service Provider retains personal data based on its necessity for the stated purposes:<\/p>\n    <ul>\n      <li>User Provided Data: Retained for the duration of your use of the Application plus 12 months thereafter, unless longer retention is required by law<\/li>\n      <li>Automatically Collected Data: Retained for up to 24 months from collection, unless longer retention is required for legal compliance<\/li>\n      <li>Aggregated and Anonymized Data: Retained indefinitely as it no longer identifies you<\/li>\n      <li>Data required for legal compliance: Retained as long as required by applicable law<\/li>\n    <\/ul>\n    <p>You may request deletion of your personal data, subject to any legal obligation to retain it. If you want the Service Provider to delete User Provided Data submitted through the Application, please contact them at <a href=\"mailto:service@circlefive.co\">service@circlefive.co<\/a>. Please note that some User Provided Data may be required for the Application to function properly.<\/p>\n\n    <h2>Data Deletion<\/h2>\n    <p>You can request deletion of your personal data or account by contacting the Service Provider at <a href=\"mailto:service@circlefive.co\">service@circlefive.co<\/a>. The Service Provider will process your request within the timeframes required by applicable law.<\/p>\n    <p>Upon verification of your identity, the Service Provider will delete your personal data from its systems, except where retention is required for legal compliance or legitimate business purposes.<\/p>\n\n    <h2>Children<\/h2>\n    <p>The Application is not intended for children under 13 years of age, or such higher age as required by applicable law. The Service Provider does not knowingly solicit data from children or market the Application to them.<\/p>\n    <p>Where parental or guardian consent is required under applicable law, the Application is not intended for use without that consent. The Service Provider does not knowingly collect personally identifiable information from children under 13 years of age in violation of applicable law. In the event the Service Provider discovers that a child has provided personal information, the Service Provider will immediately delete this from their servers. If you are a parent or guardian and you are aware that your child has provided the Service Provider with personal information, please contact the Service Provider (<a href=\"mailto:service@circlefive.co\">service@circlefive.co<\/a>) so that they will be able to take the necessary actions.<\/p>\n\n    <h2>Security<\/h2>\n    <p>The Service Provider is concerned about safeguarding the confidentiality of your information. The Service Provider provides physical, electronic, and procedural safeguards to protect information the Service Provider processes and maintains.<\/p>\n\n    <h2>Data Breach Notification<\/h2>\n    <p>If a data breach occurs that affects your personal data, the Service Provider will notify you in accordance with applicable legal requirements, including, where required, providing information about the nature of the breach and the steps being taken to address it.<\/p>\n\n    <h2>Changes<\/h2>\n    <p>The Service Provider may update this Privacy Policy from time to time. The Service Provider will notify you of material changes by posting the updated Privacy Policy with an effective date. Where required by law, the Service Provider will seek your consent to material changes before they take effect.<\/p>\n    <p>Previous versions of this Privacy Policy will be maintained and made available upon request by contacting the Service Provider at <a href=\"mailto:service@circlefive.co\">service@circlefive.co<\/a>.<\/p>\n    <p>This privacy policy is effective as of 2026-07-09<\/p>\n\n    <h2>Your Consent<\/h2>\n    <p>Where processing is based on consent, you provide that consent by affirmatively opting in to the relevant feature or action. You may withdraw consent at any time without affecting processing carried out before withdrawal. Processing based on other lawful bases is carried out as described above.<\/p>\n\n    <h2>Contact Us<\/h2>\n    <p>If you have any questions regarding privacy while using the Application, or have questions about the practices, please contact the Service Provider via email at <a href=\"mailto:service@circlefive.co\">service@circlefive.co<\/a>.<\/p>\n  <\/main>\n\n  <footer class=\"site\">\n    <div class=\"wrap\">\n      <div class=\"foot-grid\">\   var LABELS = {"index": "Home", "about": "about", "company": "company", "terms": "Terms", "privacy": "Privacy"};

  var WIDTHS = [

    { id: 'tablet',  name: 'Tablet',  w: 834 },
    { id: 'desktop', name: 'Desktop', w: 1280 },
    { id: 'fit',     name: 'Fit',     w: 0 }
  ];

  var frame = document.getElementById('frame');
  var device = document.getElementById('device');
  var stage = document.getElementById('stage');
  var readout = document.getElementById('readout');
  var toast = document.getElementById('toast');
  var order = Object.keys(PAGES);
  var current = order[0];
  var width = 'fit';
  var pendingHash = '';

  // ---- build the toolbar controls ----
  var tabs = document.querySelector('.tabs');
  order.forEach(function (name) {
    var b = document.createElement('button');
    b.className = 'tab';
    b.type = 'button';
    b.role = 'tab';
    b.textContent = LABELS[name] || name;
    b.onclick = function () { show(name); };
    b.dataset.page = name;
    tabs.appendChild(b);
  });

  var segs = document.querySelector('.segs');
  WIDTHS.forEach(function (d) {
    var b = document.createElement('button');
    b.className = 'seg';
    b.type = 'button';
    b.role = 'tab';
    b.textContent = d.name;
    b.onclick = function () { setWidth(d.id); };
    b.dataset.w = d.id;
    segs.appendChild(b);
  });

  function setWidth(id) {
    width = id;
    var d = WIDTHS.filter(function (x) { return x.id === id; })[0];
    var fit = !d.w;
    stage.classList.toggle('framed', !fit);
    device.style.width = fit ? '100%' : d.w + 'px';
    device.style.maxWidth = '100%';
    Array.prototype.forEach.call(segs.children, function (b) {
      b.setAttribute('aria-selected', String(b.dataset.w === id));
    });
    measure();
  }

  function measure() {
    readout.textContent = Math.round(device.getBoundingClientRect().width) + ' px';
  }

  function show(name, hash) {
    if (!PAGES[name]) return;
    current = name;
    pendingHash = hash || '';
    Array.prototype.forEach.call(tabs.children, function (b) {
      b.setAttribute('aria-selected', String(b.dataset.page === name));
    });
    frame.srcdoc = PAGES[name];
  }

  frame.addEventListener('load', function () {
    if (!pendingHash) return;
    try {
      var t = frame.contentDocument.querySelector(pendingHash);
      if (t) t.scrollIntoView();
    } catch (e) { /* nothing to scroll to */ }
    pendingHash = '';
  });

  var toastTimer;
  window.addEventListener('message', function (e) {
    var m = e.data || {};
    if (m.t === 'nav') {
      show(m.page, m.hash);
    } else if (m.t === 'ext') {
      // The preview is sandboxed, so offsite links report their destination
      // instead of navigating -- which is what you want to check anyway.

  });

  document.addEventListener('keydown', function (e) {

    if (e.key === 'r' || e.key === 'R') { show(current); }
  });

  document.getElementById('reload').onclick = function () { show(current); };
