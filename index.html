  <style>
    :root {
      --bg: #FAF9F1;        /* m-paper  */
      --ink: #114296;       /* m-ink / m-blue */
      --ink-dark: #0B2F6E;  /* m-blue-dark — link hover */
      --ink-light: #1B68E4; /* lighter blue — pressed state, 5.06:1 with white text */
      --muted: #5A5F68;     /* m-ink-soft, darkened to 6.08:1 on --bg for body copy */
      --faint: #686E79;     /* secondary metadata, 4.86:1 on --bg */
      --panel: #F0EFE4;     /* m-cream */
      --accent: #F66E22;    /* m-orange */
      --serif: 'Caudex', Georgia, 'Times New Roman', serif;
      --hand: 'Nanum Pen Script', 'Segoe Script', cursive;
      --sans: -apple-system, 'SF Pro Text', 'SF Pro Display', system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);

      display: flex;
      flex-direction: column;

    a { color: inherit; text-decoration: none; }

    .logo { display: inline-flex; align-items: center; font-family: var(--serif); font-weight: 700; font-size: 1.6rem; line-height: 1; letter-spacing: -0.01em; }

    .logo .lc { display: inline-flex; flex-direction: column; justify-content: center; gap: 0.12em; margin: 0 0.11em; }
    .logo .lc i { width: 0.2em; height: 0.2em; border-radius: 50%; background: var(--accent); }
    .topbar nav { display: flex; gap: 26px; font-size: 0.95rem; color: var(--muted); font-weight: 500; }
    .topbar nav a:hover { color: var(--ink); }
    @media (max-width: 480px) { .topbar nav { gap: 16px; font-size: 0.9rem; } }

    /* ---------- Stage (center) ---------- */
    .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(20px, 3.5vh, 40px); padding: 0 20px; text-align: center; min-height: 0; }
    .headline { font-family: var(--serif); font-weight: 400; font-size: clamp(2rem, 5.4vw, 4.2rem); line-height: 1.06; letter-spacing: -0.01em; }
    .headline .it { color: var(--accent); }

    /* ---------- Key-feature animation (looping, vanilla JS) ---------- */
    .kf-wrap {
      --kfh: min(52vh, 520px);
      --kfw: min(92vw, calc(var(--kfh) * 16 / 9));
      width: var(--kfw); height: calc(var(--kfw) * 9 / 16);
      position: relative; overflow: hidden; border-radius: 28px;
      box-shadow: 0 40px 80px -40px rgba(0,0,0,0.42);
      background: #E6E4D8;
    }
    .kf-stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform-origin: top left; font-family: var(--sans); }
    .kf-vignette, .kf-flash { position: absolute; inset: 0; }
    .kf-vignette { background: radial-gradient(circle at 50% 42%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 62%); }
    .kf-flash { background: #fff; opacity: 0; pointer-events: none; }
    .kf-cam { position: absolute; inset: 0; }

    .kf-radar { position: absolute; left: 960px; top: 540px; opacity: 0; }
    .kf-ring { position: absolute; border-radius: 50%; }
    .kf-ring.d1 { left: -450px; top: -450px; width: 900px; height: 900px; border: 2px dashed rgba(17,66,150,0.16); }
    .kf-ring.d2 { left: -330px; top: -330px; width: 660px; height: 660px; border: 2px solid rgba(17,66,150,0.12); }
    .kf-ring.d3 { left: -210px; top: -210px; width: 420px; height: 420px; border: 2px dashed rgba(17,66,150,0.16); }
    .kf-spin-mask { position: absolute; left: -450px; top: -450px; width: 900px; height: 900px; border-radius: 50%; overflow: hidden; }
    .kf-spin { position: absolute; inset: 0; transform-origin: 50% 50%; background: conic-gradient(from 0deg, rgba(17,66,150,0.14) 0deg, rgba(17,66,150,0.05) 34deg, rgba(17,66,150,0) 104deg); }
    .kf-hub { position: absolute; left: -82px; top: -82px; width: 164px; height: 164px; }
    .kf-hub-face { position: absolute; inset: 8px; border-radius: 50%; background: var(--bg); border: 2.5px solid rgba(17,66,150,0.18); box-shadow: 0 5px 24px rgba(17,66,150,0.13); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .kf-hub-num { font-family: var(--serif); font-weight: 700; font-size: 40px; letter-spacing: -1px; line-height: 1; color: var(--ink); }
    .kf-hub-num span { color: #7C8087; }
    .kf-hub-label { font-weight: 700; font-size: 12px; letter-spacing: 1.6px; color: #7C8087; }

    .kf-phone { position: absolute; width: 216px; height: 469px; }

    @media (prefers-reduced-motion: reduce) {

    }

  </style>

  <script>
    (function () {
      const wrap = document.getElementById('kfWrap');
      const stage = document.getElementById('kfStage');
      if (!wrap || !stage) return;

      /* ---- easing + interpolation, ported from the source composition engine ---- */
      const Easing = {
        linear: (t) => t,
        easeInQuad: (t) => t * t,
        easeOutQuad: (t) => t * (2 - t),
        easeInOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
        easeOutCubic: (t) => (--t) * t * t + 1,
        easeOutBack: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
      };
      function interpolate(input, output, ease) {
        ease = ease || Easing.linear;
        return (t) => {
          if (t <= input[0]) return output[0];
          if (t >= input[input.length - 1]) return output[output.length - 1];
          for (let i = 0; i < input.length - 1; i++) {
            if (t >= input[i] && t <= input[i + 1]) {
              const span = input[i + 1] - input[i];
              const local = span === 0 ? 0 : (t - input[i]) / span;
              return output[i] + (output[i + 1] - output[i]) * ease(local);
            }
          }
          return output[output.length - 1];
        };
      }
      function animate(o) {
        const from = o.from, to = o.to, start = o.start, end = o.end, ease = o.ease || Easing.linear;
        return (t) => {
          if (t <= start) return from;
          if (t >= end) return to;
          return from + (to - from) * ease((t - start) / (end - start));
        };
      }
      const MOTION = {
        enter: (o) => animate(Object.assign({ ease: Easing.easeOutCubic }, o)),
        pop: (o) => animate(Object.assign({ ease: Easing.easeOutBack }, o)),
        fall: (o) => animate(Object.assign({ ease: Easing.easeInQuad }, o)),
      };

      /* ---- scene data, ported from Minti Key Feature (2) ---- */
      const CUES = { Gather: 0, Flip: 2.8, Flash: 6.8, Photo: 8.0, Candy: 10.8, Close: 14.2 };
      const END = 16.0;
      const LAND = CUES.Candy + 1.75;
      const PW = 216, PH = 469;
      const PHONES = [
        { idx: 0, order: 0, x: 396, y: 300, rot: -12, initial: 'J', tag: 'you', tdx: 0, tdy: 268 },
        { idx: 1, order: 1, x: 1524, y: 296, rot: 11, initial: 'M', tag: 'Maya', tdx: 0, tdy: 268 },
        { idx: 2, order: 3, x: 556, y: 796, rot: 8, initial: 'L', tag: 'Leo', tdx: -150, tdy: -50 },
        { idx: 3, order: 2, x: 1364, y: 792, rot: -9, initial: 'R', tag: 'Rin', tdx: 150, tdy: -50 },
      ];
      const JAR_CANDIES = [
        { src: 'hero-anim/candy-13.webp', x: 16, y: 6, w: 94, r: -12 },
        { src: 'hero-anim/candy-27.webp', x: 108, y: 0, w: 88, r: 9 },
        { src: 'hero-anim/candy-33.webp', x: 198, y: 8, w: 86, r: -6 },
        { src: 'hero-anim/candy-05.webp', x: 60, y: 74, w: 84, r: 14 },
        { src: 'hero-anim/candy-58.webp', x: 150, y: 80, w: 90, r: -10 },
        { src: 'hero-anim/candy-22.webp', x: 232, y: 82, w: 74, r: 16 },
        { src: 'hero-anim/candy-09.webp', x: 24, y: 92, w: 70, r: -18 },
      ];
      const R = 62, CIRC = 2 * Math.PI * R;

      /* ---- build phone DOM ---- */
      const phonesRoot = document.getElementById('kfPhones');
      const phoneEls = PHONES.map((p) => {
        const el = document.createElement('div');
        el.className = 'kf-phone';
        el.style.left = (p.x - PW / 2) + 'px';
        el.style.top = (p.y - PH / 2) + 'px';
        el.innerHTML =
          '<div class="kf-phone-shadow" data-shadow></div>' +
          '<div class="kf-phone-inner" data-inner>' +
            '<div class="kf-phone-face front" data-front>' +
              '<div class="kf-screen">' +
                '<div class="kf-row"><span>9:41</span><span class="kf-notch"></span></div>' +
                '<div class="kf-nav"><span class="kf-back-btn">&larr;</span><span class="kf-wordmark">m:t</span></div>' +
                '<h3>Everyone&rsquo;s here.</h3>' +
                '<p class="kf-hint">flip it face down to start &#10022;</p>' +
                '<div class="kf-radar-mini">' +
                  '<span class="rm-ring rm-d"></span><span class="rm-ring rm-s"></span>' +
                  '<div class="rm-mask"><div class="rm-spin" data-rm-spin></div></div>' +
                  '<div class="kf-you-chip"><div class="av">' + p.initial + '</div><div class="lb">you</div></div>' +
                '</div>' +
                '<div class="kf-pill">Flip to start</div>' +
              '</div>' +
            '</div>' +
            '<div class="kf-phone-face back" data-back>' +
              '<div class="kf-back-cam"><i></i><i></i></div>' +
              '<div class="kf-back-mark">min<span>:</span>ti</div>' +
              '<div class="kf-back-sheen"></div>' +
            '</div>' +
          '</div>' +
          '<div class="kf-tag" data-tag>' + p.tag + '</div>' +
          '<div class="kf-ready" data-ready>FACE DOWN</div>';
        phonesRoot.appendChild(el);
        return {
          p: p,
          root: el,
          shadow: el.querySelector('[data-shadow]'),
          inner: el.querySelector('[data-inner]'),
          front: el.querySelector('[data-front]'),
          back: el.querySelector('[data-back]'),
          rmSpin: el.querySelector('[data-rm-spin]'),
          tag: el.querySelector('[data-tag]'),
          ready: el.querySelector('[data-ready]'),
        };
      });

      /* ---- build jar candies ---- */
      const jarCandiesRoot = document.getElementById('kfJarCandies');
      const candyEls = JAR_CANDIES.map((c, k) => {
        const img = document.createElement('img');
        img.src = c.src; img.alt = '';
        img.style.left = c.x + 'px';
        img.style.width = c.w + 'px';
        img.style.transform = 'rotate(' + c.r + 'deg)';
        jarCandiesRoot.appendChild(img);
        return { c: c, k: k, el: img };
      });

      /* ---- static refs ---- */
      const camEl = document.getElementById('kfCam');
      const radarEl = document.getElementById('kfRadar');
      const spin1El = document.getElementById('kfSpin1');
      const hubEl = document.getElementById('kfHub');
      const hubNumEl = document.getElementById('kfHubNum');
      const hubLabelEl = document.getElementById('kfHubLabel');
      const hubCircleEl = document.getElementById('kfHubCircle');
      const jarEl = document.getElementById('kfJar');
      const jarSqA = document.getElementById('kfJarSqA');
      const jarSqB = document.getElementById('kfJarSqB');
      const jarLid = document.getElementById('kfJarLid');
      const bearEl = document.getElementById('kfBear');
      const jarTagEl = document.getElementById('kfJarTag');
      const polaroidEl = document.getElementById('kfPolaroid');
      const developEl = document.getElementById('kfDevelop');
      const closeEl = document.getElementById('kfClose');
      const flashEl = document.getElementById('kfFlash');
      const captionEl = document.getElementById('kfCaption');
      hubCircleEl.setAttribute('stroke-dasharray', CIRC.toFixed(2));

      const CAPTIONS = [
        { at: 1.05, until: CUES.Flip + 0.1, text: 'four phones. one table.' },
        { at: CUES.Flip + 0.45, until: CUES.Flash, text: 'flip them face down →' },
        { at: CUES.Photo + 0.55, until: CUES.Candy + 0.2, text: 'minti gives the moment back' },
        { at: CUES.Candy + 1.2, until: CUES.Close, text: 'one session = one candy' },
      ];
      const CAPTION_FADE = 0.18;

      /* ---- per-frame render ---- */
      function render(T) {
        const flipped = PHONES.filter((p) => T >= CUES.Flip + 0.25 + p.order * 0.82 + 0.62).length;

        const camS = interpolate(
          [0, CUES.Flip, CUES.Flash, CUES.Flash + 0.5, CUES.Candy, CUES.Candy + 1.6, END],
          [1.02, 1.06, 1.13, 1.00, 1.10, 1.06, 1.02], Easing.easeInOutSine)(T);
        const camY = interpolate(
          [0, CUES.Flash + 0.5, CUES.Candy, CUES.Candy + 1.6, END],
          [0, 0, 26, -84, 0], Easing.easeInOutSine)(T);
        const flashA = interpolate(
          [CUES.Flash + 0.16, CUES.Flash + 0.26, CUES.Flash + 0.34, CUES.Flash + 0.40, CUES.Flash + 0.46, CUES.Flash + 0.98],
          [0, 0.96, 0.55, 1, 0.92, 0], Easing.linear)(T);
        const inAll = MOTION.enter({ from: 0, to: 1, start: 0, end: 0.35 })(T);
        const outAll = MOTION.enter({ from: 1, to: 0, start: END - 0.75, end: END - 0.05 })(T);

        camEl.style.opacity = inAll * outAll;
        camEl.style.transform = 'translateY(' + camY + 'px) scale(' + camS + ')';
        flashEl.style.opacity = flashA;

        /* table radar */
        const rO = MOTION.enter({ from: 0, to: 1, start: 0.05, end: 0.9 })(T)
          * MOTION.enter({ from: 1, to: 0, start: CUES.Flash - 0.25, end: CUES.Flash + 0.30 })(T);
        const rSpin = (T * 62) % 360;
        const rGrow = MOTION.enter({ from: 0.82, to: 1, start: 0.05, end: 1.1 })(T);
        const done = flipped >= 4;
        const hubPop = MOTION.pop({ from: 0.86, to: 1, start: 0.5, end: 1.1 })(T);
        radarEl.style.opacity = rO;
        radarEl.querySelectorAll('.kf-ring').forEach((r) => { r.style.transform = 'scale(' + rGrow + ')'; });
        spin1El.style.transform = 'rotate(' + rSpin + 'deg)';
        hubEl.style.transform = 'scale(' + hubPop + ')';
        hubNumEl.innerHTML = flipped + '<span>/4</span>';
        hubNumEl.style.color = done ? 'var(--ink)' : '';
        hubLabelEl.textContent = done ? 'LIVE' : 'FRIENDS';
        hubLabelEl.style.color = done ? '#7AE582' : '#7C8087';
        hubCircleEl.setAttribute('stroke', done ? '#7AE582' : '#114296');
        hubCircleEl.setAttribute('stroke-dashoffset', (CIRC * (1 - flipped / 4)).toFixed(2));

        /* phones */
        phoneEls.forEach((pe) => {
          const p = pe.p;
          const t0 = 0.18 + p.idx * 0.15;
          const inO = MOTION.enter({ from: 0, to: 1, start: t0, end: t0 + 0.45 })(T);
          const inY = MOTION.pop({ from: -74, to: 0, start: t0, end: t0 + 0.85 })(T);
          const inS = MOTION.pop({ from: 0.84, to: 1, start: t0, end: t0 + 0.85 })(T);

          const fs = CUES.Flip + 0.25 + p.order * 0.82;
          const flip = MOTION.enter({ from: 0, to: 180, start: fs + 0.16, end: fs + 0.78 })(T);
          const lift = interpolate([fs, fs + 0.26, fs + 0.56, fs + 0.9], [0, -46, -12, 0], Easing.easeInOutSine)(T);
          const settle = interpolate([fs + 0.78, fs + 0.94, fs + 1.1], [1, 0.955, 0.972], Easing.easeOutQuad)(T);
          const outO = MOTION.enter({ from: 1, to: 0, start: CUES.Flash + 0.40, end: CUES.Flash + 0.60 })(T);

          const nameO = MOTION.enter({ from: 0, to: 1, start: t0 + 0.4, end: t0 + 0.8 })(T)
            * MOTION.enter({ from: 1, to: 0, start: fs - 0.1, end: fs + 0.25 })(T);
          const readyO = MOTION.pop({ from: 0, to: 1, start: fs + 0.66, end: fs + 0.92 })(T) * outO;
          const readyS = MOTION.pop({ from: 0.5, to: 1, start: fs + 0.66, end: fs + 0.95 })(T);

          const back = flip >= 90;
          const shade = 1 + (-lift / 46) * 0.35;
          const spin = (T * 84) % 360;

          pe.root.style.opacity = inO * outO;
          pe.shadow.style.width = (PW * 0.82 * shade) + 'px';
          pe.shadow.style.marginLeft = -(PW * 0.82 * shade) / 2 + 'px';
          pe.shadow.style.filter = 'blur(' + (10 + (-lift / 46) * 8) + 'px)';
          pe.shadow.style.opacity = 0.9 - (-lift / 46) * 0.35;
          pe.inner.style.transform = 'rotate(' + p.rot + 'deg) translateY(' + (inY + lift) + 'px) scale(' + (inS * settle) + ')';
          pe.front.style.opacity = back ? 0 : 1;
          pe.front.style.transform = 'rotateX(' + flip + 'deg)';
          pe.back.style.opacity = back ? 1 : 0;
          pe.back.style.transform = 'rotateX(' + (flip - 180) + 'deg)';
          pe.rmSpin.style.transform = 'rotate(' + spin + 'deg)';
          pe.tag.style.transform = 'translate(' + p.tdx + 'px,' + p.tdy + 'px) rotate(-3deg)';
          pe.tag.style.opacity = nameO;
          pe.ready.style.transform = 'translate(' + p.tdx + 'px,' + (p.tdy - 4) + 'px) scale(' + readyS + ')';
          pe.ready.style.opacity = readyO;
        });

        /* polaroid */
        const s0 = CUES.Flash + 0.52;
        const pO = MOTION.enter({ from: 0, to: 1, start: s0, end: s0 + 0.28 })(T);
        const drop = MOTION.pop({ from: -70, to: 0, start: s0, end: s0 + 0.9 })(T);
        const sc = MOTION.pop({ from: 0.72, to: 1, start: s0, end: s0 + 0.9 })(T);
        const rot = interpolate([s0, s0 + 0.9, CUES.Candy + 0.5], [-9, -3.2, 6], Easing.easeInOutSine)(T);
        const develop = MOTION.enter({ from: 1, to: 0, start: s0 + 0.25, end: s0 + 1.5 })(T);
        const mSt = CUES.Candy + 0.15, mEn = CUES.Candy + 0.85;
        const morphS = MOTION.enter({ from: 1, to: 0.14, start: mSt, end: mEn })(T);
        const morphO = MOTION.enter({ from: 1, to: 0, start: mSt + 0.3, end: mEn })(T);
        const morphY = MOTION.enter({ from: 0, to: -134, start: mSt, end: mEn })(T);
        polaroidEl.style.opacity = pO * morphO;
        polaroidEl.style.transform = 'translateY(' + (drop + morphY) + 'px) rotate(' + rot + 'deg) scale(' + (sc * morphS) + ')';
        developEl.style.opacity = develop;

        /* jar rig */
        const rise = MOTION.enter({ from: 560, to: 0, start: CUES.Candy + 0.1, end: CUES.Candy + 1.15 })(T);
        const jO = MOTION.enter({ from: 0, to: 1, start: CUES.Candy + 0.1, end: CUES.Candy + 0.5 })(T);
        const sq = interpolate([LAND, LAND + 0.10, LAND + 0.26, LAND + 0.48], [1, 0.93, 1.035, 1], Easing.easeOutQuad)(T);
        const jig = interpolate([LAND, LAND + 0.14, LAND + 0.3, LAND + 0.52], [0, 7, -3, 0], Easing.easeOutQuad)(T);
        const squashT = 'scaleY(' + sq + ') scaleX(' + (2 - sq) + ')';
        jarEl.style.opacity = jO;
        jarEl.style.transform = 'translateY(' + rise + 'px)';
        jarSqA.style.transform = squashT;
        jarSqB.style.transform = squashT;
        jarLid.style.transform = squashT;

        candyEls.forEach((ce) => {
          const j = ce.k % 2 ? jig : jig * 0.55;
          ce.el.style.bottom = (ce.c.y + j) + 'px';
        });

        const bMEn = CUES.Candy + 0.85;
        const born = MOTION.pop({ from: 0.18, to: 1, start: CUES.Candy + 0.55, end: bMEn + 0.14 })(T);
        const bearO = MOTION.enter({ from: 0, to: 1, start: CUES.Candy + 0.55, end: bMEn })(T);
        const by = MOTION.fall({ from: 0, to: 392, start: bMEn + 0.16, end: LAND })(T);
        const brot = interpolate([bMEn, LAND, LAND + 0.5], [-15, 9, 4], Easing.easeInOutSine)(T);
        const bsq = interpolate([LAND - 0.05, LAND + 0.05, LAND + 0.2], [1, 0.8, 1], Easing.easeOutQuad)(T);
        bearEl.style.opacity = bearO;
        bearEl.style.transform = 'translateY(' + by + 'px) rotate(' + brot + 'deg) scale(' + born + ') scaleY(' + bsq + ') scaleX(' + (2 - bsq) + ')';

        const tagO = MOTION.pop({ from: 0, to: 1, start: LAND + 0.3, end: LAND + 0.62 })(T);
        const tagS = MOTION.pop({ from: 0.55, to: 1, start: LAND + 0.3, end: LAND + 0.68 })(T);
        jarTagEl.style.opacity = tagO;
        jarTagEl.style.transform = 'rotate(-6deg) scale(' + tagS + ')';

        /* closing wordmark */
        const wordO = MOTION.enter({ from: 0, to: 1, start: CUES.Close + 0.05, end: CUES.Close + 0.6 })(T);
        const wordY = MOTION.enter({ from: 22, to: 0, start: CUES.Close + 0.05, end: CUES.Close + 0.7 })(T);
        closeEl.style.opacity = wordO * outAll;
        closeEl.style.transform = 'translateY(' + wordY + 'px)';

        /* captions */
        let active = null, until = Infinity;
        for (let i = 0; i < CAPTIONS.length; i++) {
          if (T < CAPTIONS[i].at) break;
          active = CAPTIONS[i];
          until = active.until;
        }
        if (active && T < until) {
          let o = Math.min(1, (T - active.at) / CAPTION_FADE);
          o = Math.min(o, (until - T) / CAPTION_FADE);
          captionEl.style.opacity = Math.max(0, Math.min(1, o));
          captionEl.textContent = active.text;
        } else {
          captionEl.style.opacity = 0;
        }
      }

      /* ---- responsive scale ---- */
      function fit() {
        const s = wrap.clientWidth / 1920;
        stage.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit);
      fit();

      /* ---- reduced motion: freeze on the closing frame ---- */
      const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced) {
        render(15.0);
        return;
      }

      /* ---- play loop ---- */
      let startTime = null;
      function tick(now) {
        if (startTime === null) startTime = now;
        const T = ((now - startTime) / 1000) % END;
        render(T);
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
