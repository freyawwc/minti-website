<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>minti — Real friend social</title>
  <meta name="description" content="minti is real friend social — the app that starts when you put your phone down. Made by Circle Five Studios." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caudex:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FAF9F1;        /* m-paper  */
      --ink: #114296;       /* m-ink / m-blue */
      --ink-dark: #0B2F6E;  /* m-blue-dark — link hover */
      --muted: #7C8087;     /* m-ink-soft */
      --faint: #9AA0A6;
      --panel: #F0EFE4;     /* m-cream */
      --accent: #F66E22;    /* m-orange */
      --serif: 'Caudex', Georgia, 'Times New Roman', serif;
      --hand: 'Nanum Pen Script', 'Segoe Script', cursive;
      --sans: -apple-system, 'SF Pro Text', 'SF Pro Display', system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;               /* single screen, no scroll */
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }

    /* ---------- Top bar ---------- */
    .topbar { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 22px clamp(20px, 4vw, 44px); }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 1.12rem; letter-spacing: -0.01em; }
    .logo { display: inline-flex; align-items: center; font-family: var(--serif); font-weight: 700; font-size: 1.6rem; line-height: 1; letter-spacing: -0.01em; }
    .logo .lm, .logo .lt { color: var(--ink); }
    .logo .lc { display: inline-flex; flex-direction: column; justify-content: center; gap: 0.12em; margin: 0 0.11em; }
    .logo .lc i { width: 0.2em; height: 0.2em; border-radius: 50%; background: var(--accent); }
    .topbar nav { display: flex; gap: 26px; font-size: 0.95rem; color: var(--muted); font-weight: 500; }
    .topbar nav a:hover { color: var(--ink); }
    @media (max-width: 480px) { .topbar nav { gap: 16px; font-size: 0.9rem; } }

    /* ---------- Stage (center) ---------- */
    .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(20px, 3.5vh, 40px); padding: 0 20px; text-align: center; min-height: 0; }
    .headline { font-family: var(--serif); font-weight: 400; font-size: clamp(2rem, 5.4vw, 4.2rem); line-height: 1.06; letter-spacing: -0.01em; }
    .headline .it { color: var(--accent); }

    /* ---------- 3D flipping phone ---------- */
    .stage { perspective: 1300px; perspective-origin: 50% 42%; height: min(58vh, 560px); display: grid; place-items: center; }
    .phone3d {
      position: relative; height: 100%; aspect-ratio: 300 / 610;
      transform-style: preserve-3d;
      animation: flip 8.5s cubic-bezier(.66,0,.34,1) infinite;
      will-change: transform;
    }
    .face {
      position: absolute; inset: 0; border-radius: 42px; overflow: hidden;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      box-shadow: 0 40px 80px -40px rgba(0,0,0,0.42);
    }
    .face.front { background: var(--ink); padding: 11px; }
    .scr-img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; transform: scale(1.55); border-radius: 33px; display: block; background: var(--panel); transition: opacity .25s ease; }
    .scr {
      width: 100%; height: 100%; border-radius: 33px; overflow: hidden; background: var(--panel);
      display: flex; flex-direction: column; align-items: center;
      padding: 8% 8% 6%; position: relative;
    }
    .notch { position: absolute; top: 3.2%; left: 50%; transform: translateX(-50%); width: 30%; height: 3.6%; background: var(--ink); border-radius: 999px; z-index: 3; }
    .p-eyebrow { font-size: clamp(0.6rem, 1.4vh, 0.72rem); letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); font-weight: 700; margin-top: 6%; }
    .p-ring { position: relative; width: 54%; aspect-ratio: 1; margin: 8% 0 5%; }
    .p-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .p-ring .glyph { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(1.6rem, 4.4vh, 2.6rem); }
    .p-timer { font-family: var(--serif); font-size: clamp(2rem, 5.4vh, 3.2rem); letter-spacing: -0.02em; }
    .p-timer-label { font-size: clamp(0.7rem, 1.5vh, 0.82rem); color: var(--muted); margin-top: 2px; }
    .p-members { display: flex; margin-top: 6%; }
    .p-members .m { width: clamp(28px, 4.6vh, 36px); aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--panel); margin-left: -8px; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 0.86rem; font-family: var(--sans); }
    .p-members .m:first-child { margin-left: 0; }
    .p-status { margin-top: auto; background: #fff; border-radius: 999px; padding: 2.4% 6%; font-size: clamp(0.7rem, 1.5vh, 0.8rem); font-weight: 600; box-shadow: 0 8px 20px -12px rgba(0,0,0,0.35); }
    .face.back { transform: rotateY(180deg); background: linear-gradient(158deg, #232325 0%, #0c0c0d 88%); display: grid; place-items: center; }
    .cam { position: absolute; top: 7%; left: 8%; width: 26%; aspect-ratio: 1; border-radius: 22px; background: #060606; box-shadow: inset 0 0 0 2px #2c2c2e; }
    .cam i { position: absolute; width: 33%; aspect-ratio: 1; border-radius: 50%; background: #101012; box-shadow: inset 0 0 0 3px #313134, 0 0 8px rgba(255,255,255,0.05); }
    .cam i:nth-child(1) { top: 12%; left: 12%; } .cam i:nth-child(2) { bottom: 12%; right: 12%; }
    .cam i:nth-child(3) { top: 12%; right: 12%; width: 18%; background: #1a1a1c; }
    .back-mark { width: 28%; aspect-ratio: 1; border-radius: 24px; background: rgba(255,255,255,0.06); display: grid; place-items: center; font-family: var(--serif); font-size: clamp(1.8rem, 5vh, 2.6rem); color: rgba(255,255,255,0.92); }

    @keyframes flip {
      0%, 6%    { transform: rotateY(-14deg); }
      28%       { transform: rotateY(14deg); }
      50%, 58%  { transform: rotateY(194deg); }
      80%       { transform: rotateY(166deg); }
      100%      { transform: rotateY(-14deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .phone3d { animation: none; transform: rotateY(-10deg); }
    }

    /* ---------- Footer ---------- */
    .corner { flex: none; display: flex; justify-content: flex-start; align-items: flex-end; padding: 0 clamp(20px, 4vw, 44px) clamp(20px, 3.5vh, 34px); }
    .foot-left { display: flex; flex-direction: column; gap: 4px; font-size: 0.82rem; color: var(--faint); line-height: 1.4; }
    .foot-left a { color: var(--muted); }
    .foot-left a:hover { color: var(--ink); }

    /* download button */
    .badge { display: inline-flex; align-items: center; gap: 10px; background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 14px; transition: transform .15s ease, opacity .15s ease; }
    .badge:hover { transform: translateY(-2px); opacity: 0.9; }
    .badge svg { width: 24px; height: 24px; flex: none; }
    .badge .b-txt { text-align: left; line-height: 1.1; white-space: nowrap; }
    .badge .b-small { font-size: 0.62rem; letter-spacing: 0.03em; opacity: 0.85; display: block; }
    .badge .b-big { font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <header class="topbar">
    <a class="brand" href="#" aria-label="minti home"><span class="logo" aria-hidden="true"><span class="lm">m</span><span class="lc"><i></i><i></i></span><span class="lt">t</span></span></a>
    <nav>
      <a href="index.html">minti</a>
      <a href="about.html">about</a>
      <a href="company.html">company</a>
    </nav>
  </header>

  <!-- CENTER: flipping phone + one line below -->
  <main class="main">
    <div class="stage" aria-hidden="true">
      <div class="phone3d">
        <!-- back of the phone -->
        <div class="face back">
          <div class="cam"><i></i><i></i><i></i></div>
        </div>
        <!-- front / app screen -->
        <div class="face front">
          <img class="scr-img" src="screens/present.png" alt="minti app — together time" />
        </div>
      </div>
    </div>
    <h1 class="headline">Make time <span class="it">together.</span></h1>
    <a class="badge" href="https://apps.apple.com/tw/app/minti-lets-be-present/id6791064385" target="_blank" rel="noopener" aria-label="Download on the App Store">
      <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M16.365 1.43c.05 1.02-.34 2.02-.99 2.74-.68.76-1.78 1.34-2.85 1.26-.09-1 .38-2.04.99-2.72.68-.75 1.86-1.32 2.85-1.28zM19.6 17.06c-.53 1.22-.78 1.76-1.46 2.84-.95 1.5-2.29 3.37-3.95 3.38-1.47.02-1.85-.96-3.85-.95-2 .01-2.42.97-3.9.95-1.66-.02-2.93-1.71-3.88-3.21-2.66-4.2-2.94-9.12-1.3-11.74 1.16-1.85 3-2.93 4.72-2.93 1.76 0 2.86.98 4.31.98 1.41 0 2.27-.98 4.3-.98 1.53 0 3.16.84 4.31 2.28-3.79 2.08-3.17 7.49.6 9.38z"/></svg>
      <span class="b-txt"><span class="b-small">Download on the</span><span class="b-big">App Store</span></span>
    </a>
  </main>

  <!-- BOTTOM -->
  <footer class="corner">
    <div class="foot-left">
      <span><a href="terms.html">Terms</a> · <a href="privacy.html">Privacy</a></span>
      <span>© 2026 Circle Five Studios, Inc.</span>
    </div>
  </footer>

  <script>
    (function () {
      const el = document.querySelector('.scr-img');
      const phone = document.querySelector('.phone3d');
      if (!el || !phone) return;

      // Each screenshot gets its own framing (zoom + vertical nudge) so the
      // phone shows the app screen, not the full marketing poster.
      const shots = [
        { src: 'present.png',    s: 1.55, ty: -6 },
        { src: 'topfriends.png', s: 1.45, ty: -9 },
        { src: 'candybook.png',  s: 1.5,  ty: -8 },
        { src: 'remembered.png', s: 1.45, ty: -8 },
        { src: 'gather.png',     s: 1.45, ty: -8 },
        { src: 'jar.png',        s: 1.5,  ty: -4 },
      ];

      shots.forEach(sh => { const im = new Image(); im.src = 'screens/' + sh.src; });

      let i = 0;
      const apply = (n) => {
        const sh = shots[n];
        el.src = 'screens/' + sh.src;
        el.style.transform = 'scale(' + sh.s + ') translateY(' + sh.ty + '%)';
      };
      apply(0);

      // The flip animation is 8.5s; the phone shows its BACK around the middle
      // of the cycle. animationiteration fires when it returns to the front, so
      // we swap ~0.54 into the next cycle (back facing) and the new shot is
      // already in place when it flips forward again.
      const DUR = 8500;
      phone.addEventListener('animationiteration', () => {
        setTimeout(() => { i = (i + 1) % shots.length; apply(i); }, DUR * 0.54);
      });
    })();
  </script>
</body>
</html>
